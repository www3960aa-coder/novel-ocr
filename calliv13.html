<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>캘리 v10</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--p:#7c6ab5;--p2:#a99fd8;--bg:#13111e;--card:#1c1a2e;--card2:#252340;--tx:#e4e0f5;--tx2:#a8a0cc;--bd:#3a3560;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:14px;}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;}
#ov.show{display:block;}

#sideL{position:fixed;left:-290px;top:0;bottom:0;width:285px;background:var(--card);z-index:600;transition:left .22s;display:flex;flex-direction:column;border-right:1px solid var(--bd);}
#sideL.open{left:0;}
#sideR{position:fixed;right:-215px;top:0;bottom:0;width:210px;background:var(--card);z-index:600;transition:right .22s;display:flex;flex-direction:column;border-left:1px solid var(--bd);}
#sideR.open{right:0;}

.ph{padding:12px 14px;background:linear-gradient(135deg,#5c4d9a,#7c6ab5);color:#fff;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;flex-shrink:0;}
.px{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 5px;}
.pb{flex:1;overflow-y:auto;padding:10px 11px;}

.bpb{display:block;width:100%;padding:8px 9px;border-radius:7px;border:1px solid var(--bd);background:var(--card2);font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:3px;color:var(--tx);line-height:1.3;}
.bpb small{display:block;font-size:10px;color:var(--tx2);font-weight:400;margin-top:1px;}
.bpb:active{background:rgba(124,106,181,.25);border-color:var(--p);}

.acc{border:1px solid var(--bd);border-radius:8px;margin-bottom:7px;overflow:hidden;}
.ach{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--card2);cursor:pointer;font-size:12px;font-weight:600;color:var(--p2);user-select:none;}
.ach .ar{transition:transform .18s;font-size:10px;}
.ach.open .ar{transform:rotate(180deg);}
.acb{padding:10px;display:none;background:var(--card);}
.acb.open{display:block;}

.sg{border:1px solid var(--bd);border-radius:8px;margin-bottom:7px;overflow:hidden;}
.sgh{padding:9px 11px;background:var(--card2);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;color:var(--tx);}
.sgb{display:none;padding:10px;}
.sgb.open{display:block;}

#topbar{background:var(--card);border-bottom:1px solid var(--bd);padding:8px 11px 0;flex-shrink:0;}
#tr1{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.tb{background:var(--card2);color:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:15px;cursor:pointer;flex-shrink:0;line-height:1;}
.tb:active{background:rgba(124,106,181,.3);}
#tbf{font-size:11px;color:var(--tx2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tbopen{background:linear-gradient(135deg,#5c4d9a,#7c6ab5);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.tab-bar{display:flex;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:9px 13px;border:none;background:transparent;color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--p2);border-bottom-color:var(--p);}
.tab-btn:disabled{opacity:.3;cursor:not-allowed;}

#sb{background:var(--card);border-bottom:1px solid var(--bd);padding:7px 10px;display:none;flex-shrink:0;align-items:center;gap:5px;}
#sb.show{display:flex;}
.sc{flex:1;padding:9px 4px;border-radius:8px;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.sc:active{opacity:.85;}
#brem{flex:0 0 auto;padding:9px 10px;border-radius:8px;border:1.5px solid var(--bd);background:transparent;color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;}
#bcfg{background:var(--card2);color:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:9px;font-size:13px;cursor:pointer;flex-shrink:0;}
#bblk{background:linear-gradient(135deg,#5c4d9a,#7c6ab5);color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;cursor:pointer;flex-shrink:0;}

#undoBar{background:var(--card);border-bottom:1px solid var(--bd);padding:5px 10px;display:none;flex-shrink:0;align-items:center;gap:5px;}
#undoBar.show{display:flex;}
.ubtn{flex:1;padding:7px 5px;border-radius:7px;border:1px solid var(--bd);background:var(--card2);color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.ubtn:disabled{opacity:.3;cursor:not-allowed;}
.ubtn:not(:disabled):active{background:rgba(124,106,181,.25);border-color:var(--p);}

#alignBar{background:var(--card);border-bottom:1px solid var(--bd);padding:5px 10px;display:none;flex-shrink:0;align-items:center;gap:4px;}
#alignBar.show{display:flex;}
.albtn{flex:1;padding:7px 3px;border-radius:7px;border:1px solid var(--bd);background:var(--card2);color:var(--tx2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.albtn.active{background:rgba(124,106,181,.3);border-color:var(--p);color:var(--p2);}
.alsep{width:1px;height:22px;background:var(--bd);flex-shrink:0;}

#main{flex:1;overflow-y:auto;padding:11px;}
.tc{display:none;}
.tc.active{display:block;}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;border:1px solid var(--bd);}
.ct{font-size:12px;font-weight:700;color:var(--p2);margin-bottom:8px;}
.btn{display:block;width:100%;background:linear-gradient(135deg,#5c4d9a,#7c6ab5);color:#fff;border:none;padding:12px;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.bsm{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-radius:7px;background:linear-gradient(135deg,#5c4d9a,#7c6ab5);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;}
.bsm.g{background:transparent;color:var(--p2);border:1.5px solid var(--bd);}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.brow .bsm{flex:1;}

label{display:block;font-size:11px;color:var(--tx2);margin-bottom:3px;margin-top:9px;}
label:first-child{margin-top:0;}
input[type=text],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:var(--card2);color:var(--tx);}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);}
input[type=color]{width:100%;height:38px;padding:2px 5px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;background:var(--card2);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}

.tl{max-height:50vh;overflow-y:auto;}
.ti{display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;margin-bottom:4px;background:var(--card2);}
.ti input{flex:1;padding:5px 7px;font-size:12px;margin:0;border:none;background:transparent;color:var(--tx);}
.tib{display:flex;gap:3px;flex-shrink:0;}
.tib button{width:24px;height:24px;border:none;border-radius:5px;background:var(--card);color:var(--tx2);font-size:10px;cursor:pointer;border:1px solid var(--bd);}
.tib button:last-child{background:rgba(220,80,80,.2);color:#f87171;border-color:rgba(220,80,80,.3);}

#pv{border:2px dashed var(--bd);border-radius:9px;padding:11px;min-height:120px;font-size:14px;line-height:1.8;background:#fff;color:#333;margin:7px 0;outline:none;max-height:55vh;overflow-y:auto;}

#dpop{position:fixed;z-index:700;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.4);display:none;width:160px;}
#dpop.show{display:block;}
#dpop .dpt{font-size:11px;color:var(--tx2);margin-bottom:8px;}
#dpop .dedt{width:100%;padding:9px;background:rgba(124,106,181,.2);color:var(--p2);border:1px solid var(--p);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;}
#dpop .ddel{width:100%;padding:9px;background:rgba(220,80,80,.2);color:#f87171;border:1px solid rgba(220,80,80,.3);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
#dpop-x{position:absolute;top:7px;right:8px;background:none;border:none;font-size:14px;color:var(--tx2);cursor:pointer;}

.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;display:flex;align-items:flex-end;}
.mbg.hidden{display:none;}
.ms{background:var(--card);border-radius:18px 18px 0 0;padding:15px 13px 26px;width:100%;max-height:78vh;overflow-y:auto;border-top:1px solid var(--bd);}
.mt{font-size:14px;font-weight:700;color:var(--p2);margin-bottom:12px;text-align:center;}

.grad-target-label{font-size:10px;color:var(--p2);margin-bottom:4px;font-weight:600;}
.grad-target-row{display:flex;gap:6px;margin-bottom:8px;}
.grad-target-btn{flex:1;padding:7px 5px;border-radius:7px;border:2px solid var(--bd);font-size:11px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--tx2);}
.grad-target-btn.sel{border-color:var(--p);color:var(--p2);background:rgba(124,106,181,.2);}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(124,106,181,.95);color:#fff;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;z-index:900;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}

.hidden{display:none!important;}
</style>
</head>
<body>
<input type="file" id="epubInput" accept=".epub" class="hidden">
<div id="ov" onclick="closeAll()"></div>

<!-- 왼쪽: 씬 설정 -->
<div id="sideL">
  <div class="ph">⚙️ 씬 스타일 설정<button class="px" onclick="closeSide()">✕</button></div>
  <div class="pb">
    <div class="sg">
      <div class="sgh" onclick="tsg(this)"><span id="dM" style="width:12px;height:12px;border-radius:50%;background:#888;display:inline-block;flex-shrink:0;"></span>🌫 회상 씬</div>
      <div class="sgb">
        <div class="g2">
          <div><label>글자색</label><input type="color" id="mC" value="#888888" oninput="us('memory','color',this.value)"></div>
          <div><label>글자 뒤 배경</label><input type="color" id="mB" value="#ffffff" oninput="us('memory','bg',this.value)"></div>
        </div>
        <div class="g3" style="margin-top:6px;">
          <div><label>굵기</label><select id="mW" onchange="us('memory','bold',this.value)"><option value="normal">보통</option><option value="bold">굵게</option></select></div>
          <div><label>기울임</label><select id="mI" onchange="us('memory','italic',this.value)"><option value="italic" selected>켜짐</option><option value="normal">꺼짐</option></select></div>
          <div><label>크기</label><input type="text" id="mS" placeholder="기본" oninput="us('memory','size',this.value)" style="padding:7px;font-size:12px;"></div>
        </div>
        <div style="margin-top:8px;">
          <div class="grad-target-label">그라디언트 적용 대상</div>
          <div class="grad-target-row">
            <button class="grad-target-btn sel" id="gtM_color" onclick="setGradTarget('memory','color')">단색</button>
            <button class="grad-target-btn" id="gtM_grad" onclick="setGradTarget('memory','grad')">그라디언트</button>
          </div>
          <div id="gM" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;"></div>
          <button onclick="applySceneToAll('memory')" style="width:100%;margin-top:8px;padding:8px;border-radius:7px;border:1px solid var(--p);background:rgba(124,106,181,.15);color:var(--p2);font-size:12px;font-weight:700;cursor:pointer;">↺ 회상 씬 전체 업데이트</button>
        </div>
      </div>
    </div>
    <div class="sg">
      <div class="sgh" onclick="tsg(this)"><span id="dN" style="width:12px;height:12px;border-radius:50%;background:#5c6bc0;display:inline-block;flex-shrink:0;"></span>💭 독백 씬</div>
      <div class="sgb">
        <div class="g2">
          <div><label>글자색</label><input type="color" id="nC" value="#5c6bc0" oninput="us('mono','color',this.value)"></div>
          <div><label>글자 뒤 배경</label><input type="color" id="nB" value="#ffffff" oninput="us('mono','bg',this.value)"></div>
        </div>
        <div class="g3" style="margin-top:6px;">
          <div><label>굵기</label><select id="nW" onchange="us('mono','bold',this.value)"><option value="bold" selected>굵게</option><option value="normal">보통</option></select></div>
          <div><label>기울임</label><select id="nI" onchange="us('mono','italic',this.value)"><option value="normal" selected>꺼짐</option><option value="italic">켜짐</option></select></div>
          <div><label>크기</label><input type="text" id="nS" placeholder="기본" oninput="us('mono','size',this.value)" style="padding:7px;font-size:12px;"></div>
        </div>
        <div style="margin-top:8px;">
          <div class="grad-target-label">그라디언트 적용 대상</div>
          <div class="grad-target-row">
            <button class="grad-target-btn sel" id="gtN_color" onclick="setGradTarget('mono','color')">단색</button>
            <button class="grad-target-btn" id="gtN_grad" onclick="setGradTarget('mono','grad')">그라디언트</button>
          </div>
          <div id="gN" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;"></div>
          <button onclick="applySceneToAll('mono')" style="width:100%;margin-top:8px;padding:8px;border-radius:7px;border:1px solid var(--p);background:rgba(124,106,181,.15);color:var(--p2);font-size:12px;font-weight:700;cursor:pointer;">↺ 독백 씬 전체 업데이트</button>
        </div>
      </div>
    </div>
    <div class="sg">
      <div class="sgh" onclick="tsg(this)"><span id="dE" style="width:12px;height:12px;border-radius:50%;background:#e91e63;display:inline-block;flex-shrink:0;"></span>✨ 강조 씬</div>
      <div class="sgb">
        <div class="g2">
          <div><label>글자색</label><input type="color" id="eC" value="#e91e63" oninput="us('emph','color',this.value)"></div>
          <div><label>글자 뒤 배경</label><input type="color" id="eB" value="#ffffff" oninput="us('emph','bg',this.value)"></div>
        </div>
        <div class="g3" style="margin-top:6px;">
          <div><label>굵기</label><select id="eW" onchange="us('emph','bold',this.value)"><option value="bold" selected>굵게</option><option value="normal">보통</option></select></div>
          <div><label>기울임</label><select id="eI" onchange="us('emph','italic',this.value)"><option value="normal" selected>꺼짐</option><option value="italic">켜짐</option></select></div>
          <div><label>크기</label><input type="text" id="eS" placeholder="기본" oninput="us('emph','size',this.value)" style="padding:7px;font-size:12px;"></div>
        </div>
        <div style="margin-top:8px;">
          <div class="grad-target-label">그라디언트 적용 대상</div>
          <div class="grad-target-row">
            <button class="grad-target-btn sel" id="gtE_color" onclick="setGradTarget('emph','color')">단색</button>
            <button class="grad-target-btn" id="gtE_grad" onclick="setGradTarget('emph','grad')">그라디언트</button>
          </div>
          <div id="gE" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;"></div>
          <button onclick="applySceneToAll('emph')" style="width:100%;margin-top:8px;padding:8px;border-radius:7px;border:1px solid var(--p);background:rgba(124,106,181,.15);color:var(--p2);font-size:12px;font-weight:700;cursor:pointer;">↺ 강조 씬 전체 업데이트</button>
        </div>
      </div>
    <div class="sg">
      <div class="sgh" onclick="tsg(this)">✦ 장식선</div>
      <div class="sgb">
        <div style="font-size:10px;color:var(--tx2);margin-bottom:6px;">클릭하면 클립보드에 복사됩니다</div>
        <div id="decoLines" style="display:flex;flex-direction:column;gap:4px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- 오른쪽: 블록 패널 -->
<div id="sideR">
  <div class="ph">📦 블록 삽입<button class="px" onclick="closeBlock()">✕</button></div>
  <div class="pb">
    <div class="acc"><div class="ach open" onclick="tacc(this)">💬 메신저 <span class="ar">▼</span></div>
      <div class="acb open">
        <button class="bpb" onclick="openKakaoListModal()">💛 카톡 채팅방 목록</button>
        <button class="bpb" onclick="openKakaoModal()">💬 카톡 대화창 래퍼</button>
        <button class="bpb" onclick="ib('kakao_recv')">◀ 받은 카톡</button>
        <button class="bpb" onclick="ib('kakao_sent')">▶ 보낸 카톡</button>
        <button class="bpb" onclick="ib('kakao_date')">📅 날짜 구분선</button>
        <button class="bpb" onclick="ib('bubble')">🫧 버블(Bubble)</button>
      </div>
    </div>
    <div class="acc"><div class="ach" onclick="tacc(this)">📱 SNS <span class="ar">▼</span></div>
      <div class="acb">
        <button class="bpb" onclick="ib('twitter')">🐦 트위터 게시글</button>
        <button class="bpb" onclick="ib('twitter_bundle')">🐦 트위터 통합<small>게시글+댓글</small></button>
        <button class="bpb" onclick="ib('twitter_rt')">🔁 트위터 인용RT</button>
        <button class="bpb" onclick="ib('insta')">📸 인스타 DM</button>
        <button class="bpb" onclick="ib('insta_feed')">📸 인스타 피드</button>
        <button class="bpb" onclick="ib('youtube')">▶ 유튜브 댓글</button>
        <button class="bpb" onclick="ib('weverse')">💚 위버스</button>
      </div>
    </div>
    <div class="acc"><div class="ach" onclick="tacc(this)">📦 박스/블록 <span class="ar">▼</span></div>
      <div class="acb">
        <button class="bpb" onclick="openCommModal()">📋 커뮤 통합<small>색상 선택</small></button>
        <button class="bpb" onclick="ib('noti')">🔔 앱 알림 (카드형)</button>
        <button class="bpb" onclick="ib('noti2')">📱 앱 알림 (SMS형)<small>제목+본문+예/아니오</small></button>
        <button class="bpb" onclick="ib('system_h')">🖥 시스템 메시지 (가로)</button>
        <button class="bpb" onclick="ib('system_v')">📋 시스템 메시지 (세로)<small>SYSTEM 박스 세로형</small></button>
      </div>
    </div>
    <div class="acc"><div class="ach" onclick="tacc(this)">📺 앱 화면 <span class="ar">▼</span></div>
      <div class="acb">
      </div>
    </div>
    <div class="acc"><div class="ach" onclick="tacc(this)">✂ 글자 효과 <span class="ar">▼</span></div>
      <div class="acb">
        <button class="bpb" onclick="openStrikeModal()">취소선<small>검정/빨강 선택</small></button>
      </div>
    </div>
  </div>
</div>

<!-- 헤더 -->
<div id="topbar">
  <div id="tr1">
    <button class="tb" onclick="openSide()">☰</button>
    <div id="tbf">파일을 열어주세요</div>
    <button class="tb" id="btnBlk" onclick="toggleBlock()">📦</button>
    <button id="tbopen" onclick="document.getElementById('epubInput').click()">📂 열기</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn" id="tToc" disabled onclick="sw('tocTab')">📖 목차</button>
    <button class="tab-btn" id="tEdit" disabled onclick="sw('editTab')">✏️ 본문 편집</button>
  </div>
</div>

<script>
/* ─── 전역 ─── */
var zip=null,opfPath='',opfBase='',opfDoc=null,chapPath='';
var D={title:'',author:'',files:[],toc:[],classCss:''};
var fname='';
var PR=new DOMParser();

/* ─── 실행취소 ─── */
var undoStack=[],redoStack=[],undoTimer=null;
function snapUndo(){var pv=document.getElementById('pv');undoStack.push(pv.innerHTML);if(undoStack.length>50)undoStack.shift();redoStack=[];updateUndoBtns();}
function onPvInput(){clearTimeout(undoTimer);undoTimer=setTimeout(snapUndo,600);}
function doUndo(){if(undoStack.length<2)return;var pv=document.getElementById('pv');redoStack.push(undoStack.pop());pv.innerHTML=undoStack[undoStack.length-1]||'';rebind();updateUndoBtns();}
function doRedo(){if(!redoStack.length)return;var pv=document.getElementById('pv');var s=redoStack.pop();undoStack.push(s);pv.innerHTML=s;rebind();updateUndoBtns();}
function updateUndoBtns(){document.getElementById('btnUndo').disabled=undoStack.length<2;document.getElementById('btnRedo').disabled=!redoStack.length;}

/* ─── 정렬 ─── */
function doAlign(dir){document.execCommand('justify'+dir.charAt(0).toUpperCase()+dir.slice(1),false,null);}
function doIndent(on){document.execCommand(on?'indent':'outdent',false,null);}

/* ─── 패널 제어 ─── */
function openSide(){document.getElementById('sideL').classList.add('open');document.getElementById('ov').classList.add('show');}
function closeSide(){document.getElementById('sideL').classList.remove('open');if(!document.getElementById('sideR').classList.contains('open'))document.getElementById('ov').classList.remove('show');}
function toggleBlock(){var r=document.getElementById('sideR');if(r.classList.contains('open')){closeBlock();}else{r.classList.add('open');document.getElementById('ov').classList.add('show');}}
function closeBlock(){document.getElementById('sideR').classList.remove('open');if(!document.getElementById('sideL').classList.contains('open'))document.getElementById('ov').classList.remove('show');}
function closeAll(){document.getElementById('sideL').classList.remove('open');document.getElementById('sideR').classList.remove('open');document.getElementById('ov').classList.remove('show');}
function tsg(h){h.nextElementSibling.classList.toggle('open');}
function tacc(h){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open');}

/* ─── 탭 ─── */
var TM={tocTab:'tToc',editTab:'tEdit'};
function sw(id){
  document.querySelectorAll('.tc').forEach(function(e){e.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  var el=document.getElementById(id);if(el)el.classList.add('active');
  var t=TM[id];if(t)document.getElementById(t).classList.add('active');
  var isEdit=id==='editTab';
  document.getElementById('sb').classList.toggle('show',isEdit);
  document.getElementById('undoBar').classList.toggle('show',isEdit);
  document.getElementById('alignBar').classList.toggle('show',isEdit);
}

/* ─── 그라디언트 ─── */
var GR={none:null,title:'linear-gradient(135deg,#d0ccfa,#addfe9,#dca0e3)',strawberry:'linear-gradient(180deg,#e8534a,#ffb5a7)',pink_coral:'linear-gradient(180deg,#f472b6,#e8534a)',lilac_pink:'linear-gradient(180deg,#c084fc,#f472b6)',cherry_lav:'linear-gradient(180deg,#ffb7c5,#c4b5fd)',rose_mint:'linear-gradient(180deg,#f472b6,#34d399,#a78bfa)',ocean:'linear-gradient(180deg,#4facfe,#00f2c3)',sunset:'linear-gradient(180deg,#fc5c7d,#6a3093)',indigo:'linear-gradient(180deg,#667eea,#764ba2)',lemon:'linear-gradient(180deg,#fde047,#a3e635)',peach:'linear-gradient(90deg,#fda4af,#fb7185,#c4b5fd)',rainbow:'linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff)'};
var GL=[['none','단색'],['title','라벤더민트'],['strawberry','딸기크림'],['pink_coral','핑크코랄'],['lilac_pink','라일락핑크'],['cherry_lav','벚꽃라벤더'],['rose_mint','로즈민트'],['ocean','오션'],['sunset','선셋'],['indigo','인디고'],['lemon','레몬라임'],['peach','피치로즈'],['rainbow','🌈무지개']];
var gradSel={memory:'none',mono:'none',emph:'none'};
var SS={memory:{mode:'color',color:'#888888',bg:'#fff',grad:'none',bold:'normal',italic:'italic',size:''},mono:{mode:'color',color:'#5c6bc0',bg:'#fff',grad:'none',bold:'bold',italic:'normal',size:''},emph:{mode:'color',color:'#e91e63',bg:'#fff',grad:'none',bold:'bold',italic:'normal',size:''}};

function buildGrads(){
  var ids={memory:'gM',mono:'gN',emph:'gE'};
  Object.entries(ids).forEach(function(e){
    var t=e[0],wid=e[1];
    var w=document.getElementById(wid);if(!w)return;w.innerHTML='';
    GL.forEach(function(gl){
      var k=gl[0],lb=gl[1];
      var g=GR[k];var btn=document.createElement('button');
      btn.dataset.key=k;btn.dataset.type=t;
      btn.style.cssText='padding:5px 3px;border-radius:5px;cursor:pointer;border:1.5px solid transparent;font-size:10px;text-align:center;line-height:1.3;word-break:keep-all;width:100%;';
      if(k==='none'){btn.style.background='rgba(124,106,181,.2)';btn.style.color='var(--p2)';btn.style.borderColor='var(--bd)';}
      else if(g){btn.style.background=g;btn.style.webkitBackgroundClip='text';btn.style.backgroundClip='text';btn.style.webkitTextFillColor='transparent';btn.style.fontWeight='700';}
      btn.textContent=lb;
      btn.addEventListener('click',function(){setGrad(t,k);});
      w.appendChild(btn);
    });
  });
}

var gradTargetMap={memory:'M',mono:'N',emph:'E'};
function setGradTarget(type,mode){
  SS[type].mode=mode;
  var sfx=gradTargetMap[type];
  ['color','grad'].forEach(function(m){
    var el=document.getElementById('gt'+sfx+'_'+m);
    if(el)el.classList.toggle('sel',m===mode);
  });
  syncB();
}

function getCSS(t){
  var s=SS[t];var c='';
  if(s.mode==='grad'&&GR[s.grad])c='background:'+GR[s.grad]+';-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;';
  else c='color:'+s.color+'!important;';
  return c+'background-color:'+s.bg+'!important;font-weight:'+s.bold+'!important;font-style:'+s.italic+'!important;'+(s.size?'font-size:'+s.size+'!important;':'');
}

function us(t,f,v){SS[t][f]=v;if(f==='color'){SS[t].mode='color';setGradTarget(t,'color');}syncB();}
function setGrad(t,k){
  gradSel[t]=k;
  if(k==='none'){SS[t].mode='color';}else{SS[t].mode='grad';SS[t].grad=k;}
  var sfx=gradTargetMap[t];
  var mode=k==='none'?'color':'grad';
  ['color','grad'].forEach(function(m){
    var el=document.getElementById('gt'+sfx+'_'+m);
    if(el)el.classList.toggle('sel',m===mode);
  });
  updateGradBtns(t);syncB();
}
function updateGradBtns(type){
  var wid={memory:'gM',mono:'gN',emph:'gE'}[type];
  var w=document.getElementById(wid);if(!w)return;
  var cur=gradSel[type];
  w.querySelectorAll('button').forEach(function(btn){
    if(btn.dataset.key===cur){btn.style.borderColor='#fff';btn.style.outline='2px solid var(--p)';}
    else{btn.style.outline='none';btn.style.borderColor=btn.dataset.key==='none'?'var(--bd)':'transparent';}
  });
}
function syncB(){
  var m={memory:['bM','dM'],mono:['bN','dN'],emph:['bE','dE']};
  Object.entries(m).forEach(function(e){
    var t=e[0],arr=e[1];
    var bi=arr[0],di=arr[1];
    var s=SS[t];var dc=s.mode==='grad'&&GR[s.grad]?GR[s.grad]:s.color;
    var btn=document.getElementById(bi);if(btn)btn.style.background=dc;
    var dot=document.getElementById(di);if(dot)dot.style.background=s.mode==='grad'?'linear-gradient(90deg,#f472b6,#a78bfa)':s.color;
  });
  D.classCss='.calli-memory{'+getCSS('memory')+'}.calli-mono{'+getCSS('mono')+'}.calli-emph{'+getCSS('emph')+'}';
}

/* ─── 엔터키 처리 및 병합 시 스타일 보존 로직 ─── */
document.getElementById('pv').addEventListener('keydown', function(e) {
  // Enter 입력 시 줄바꿈 1번 = <br> 1개만 삽입
  if (e.key === 'Enter') {
    e.preventDefault();
    document.execCommand('insertLineBreak');
    snapUndo();
    return;
  }
  
  // Backspace/Delete 시 앞뒤 블록 병합으로 인한 인라인 스타일 유실(변질) 방지
  if (e.key === 'Backspace' || e.key === 'Delete') {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var r = sel.getRangeAt(0);
    
    if (r.collapsed) {
      var block = getBlockContainer(r.startContainer);
      if (block && block.id !== 'pv') {
        preserveBlockStyle(block);
        
        // 인접한 블록도 미리 스타일을 보존 처리
        if (e.key === 'Backspace' && block.previousElementSibling) {
          preserveBlockStyle(block.previousElementSibling);
        } else if (e.key === 'Delete' && block.nextElementSibling) {
          preserveBlockStyle(block.nextElementSibling);
        }
      }
    }
  }
});

// 상위 블록 요소를 찾는 헬퍼 함수
function getBlockContainer(node) {
  while (node && node.id !== 'pv') {
    if (node.nodeType === 1) {
      var d = window.getComputedStyle(node).display;
      if (d === 'block' || d === 'flex' || d === 'grid' || d === 'list-item') return node;
    }
    node = node.parentNode;
  }

}

// 블록 텍스트 병합 전, 블록의 인라인 스타일을 내부 span으로 감싸 보존하는 함수
function preserveBlockStyle(block) {
  if (!block || block.id === 'pv' || block.hasAttribute('data-styled')) return;
  var s = block.style;
  var hasStyle = s.fontSize || s.color || s.fontWeight || s.fontFamily || s.letterSpacing || s.fontStyle;
  
  if (hasStyle) {
    var span = document.createElement('span');
    if (s.fontSize) span.style.fontSize = s.fontSize;
    if (s.color) span.style.color = s.color;
    if (s.fontWeight) span.style.fontWeight = s.fontWeight;
    if (s.fontFamily) span.style.fontFamily = s.fontFamily;
    if (s.letterSpacing) span.style.letterSpacing = s.letterSpacing;
    if (s.fontStyle) span.style.fontStyle = s.fontStyle;
    
    // 내부 텍스트 및 요소들을 생성한 span 안으로 이동
    var childNodes = Array.from(block.childNodes);
    childNodes.forEach(function(child) {
      span.appendChild(child);
    });
    block.appendChild(span);
    
    // 블록 자체의 텍스트 관련 스타일 속성 제거 (병합 시 변질 방지)
    s.fontSize = '';
    s.color = '';
    s.fontWeight = '';
    s.fontFamily = '';
    s.letterSpacing = '';
    s.fontStyle = '';
    
    block.setAttribute('data-styled', 'true'); // 중복 실행 방지
  }
}

});

function analyze(z){
  D={title:fname,author:'',files:[],toc:[],classCss:''};
  try{
    z.file('META-INF/container.xml').async('string').then(function(cx){
      var cd=PR.parseFromString(cx,'application/xml');
      opfPath=cd.querySelector('rootfile').getAttribute('full-path');
      opfBase=opfPath.substring(0,opfPath.lastIndexOf('/')+1);
      z.file(opfPath).async('string').then(function(ox){
        opfDoc=PR.parseFromString(ox,'application/xml');
        var cr=opfDoc.querySelector('creator');if(cr)D.author=cr.textContent;
        var its=Array.from(opfDoc.querySelectorAll('item'));
        its.forEach(function(it){var mt=it.getAttribute('media-type');if(mt==='application/xhtml+xml'||mt==='text/html')D.files.push(it.getAttribute('href'));});
        var nav=its.find(function(it){return it.getAttribute('properties')==='nav'||(it.getAttribute('id')||'').toLowerCase().includes('nav');});
        var ncx=its.find(function(it){return it.getAttribute('media-type')==='application/x-dtbncx+xml';});
        var p1=nav?z.file(opfBase+nav.getAttribute('href')).async('string').then(function(nx){
          var nd=PR.parseFromString(nx,'application/xhtml+xml');
          var an=nd.querySelectorAll('nav a');
          if(an.length){D.toc=Array.from(an).map(function(a,i){return{id:'t'+i,title:a.textContent.trim(),href:a.getAttribute('href'),full:a.textContent.trim()};});return true;}
          return false;
        }):Promise.resolve(false);
        p1.then(function(ok){
          if(!ok&&ncx){return z.file(opfBase+ncx.getAttribute('href')).async('string').then(function(nx){var nd=PR.parseFromString(nx,'application/xml');var np=nd.querySelectorAll('navPoint');if(np.length){D.toc=Array.from(np).map(function(n,i){var tx=n.querySelector('text')?n.querySelector('text').textContent.trim():(i+1)+'화';return{id:'t'+i,title:tx,href:n.querySelector('content')?n.querySelector('content').getAttribute('src'):'',full:tx};});}return true;});}
          return ok;
        }).then(function(){
          if(!D.toc.length)D.toc=D.files.map(function(h,i){return{id:'t'+i,title:(i+1)+'화',href:h,full:(i+1)+'화'};});
          ['tToc','tEdit'].forEach(function(id){document.getElementById(id).disabled=false;});
          document.getElementById('ib2').textContent='📂 '+fname+' · 📄 '+D.files.length+'개';
          document.getElementById('ic').classList.remove('hidden');
          renderToc();populateSel();syncB();sw('tocTab');
        });
      });
    });
  }catch(err){console.error(err);alert('분석 실패: '+err.message);}
}

/* ─── 블록 삽입 ─── */
var activeB=null;
function insertRaw(html){
  var pv=document.getElementById('pv');pv.focus();
  snapUndo();
  var tmp=document.createElement('div');tmp.innerHTML=html;
  var bel=tmp.querySelector('[data-cb]');if(bel)bindB(bel);
  var sel=window.getSelection();
  if(sel.rangeCount&&pv.contains(sel.anchorNode)){
    var r=sel.getRangeAt(0);
    // 커서가 data-cb 블록 안에 있으면 그 블록 안 끝에 삽입
    var node=sel.anchorNode;
    var parentBlock=null;
    while(node&&node!==pv){
      if(node.nodeType===1&&node.hasAttribute&&node.hasAttribute('data-cb')){parentBlock=node;break;}
      node=node.parentNode;
    }
    if(parentBlock){
      var frag=document.createDocumentFragment();
      while(tmp.firstChild)frag.appendChild(tmp.firstChild);
      parentBlock.appendChild(frag);
    } else {
      r.collapse(false);
      var frag2=document.createDocumentFragment();
      while(tmp.firstChild)frag2.appendChild(tmp.firstChild);
      r.insertNode(frag2);r.collapse(false);sel.removeAllRanges();sel.addRange(r);
    }
  }else{while(tmp.firstChild)pv.appendChild(tmp.firstChild);}
}
function ib(type){var html=BL[type];if(!html)return;insertRaw(html);closeBlock();}

function bindB(el){
  if(!el||!el.hasAttribute('data-cb'))return;
  el.addEventListener('click',function(e){
    e.stopPropagation();
    activeB=el;
    var pop=document.getElementById('dpop');
    var rect=el.getBoundingClientRect();
    var top=rect.bottom+window.scrollY+6;
    if(top+100>window.innerHeight+window.scrollY)top=rect.top+window.scrollY-100;
    pop.style.top=top+'px';pop.style.left='50%';pop.style.transform='translateX(-50%)';
    pop.classList.add('show');
  });
}
function delBlock(){if(!activeB)return;if(confirm('삭제할까요?')){activeB.remove();activeB=null;closeDpop();}}
function closeDpop(){document.getElementById('dpop').classList.remove('show');activeB=null;}
document.addEventListener('click',function(e){var p=document.getElementById('dpop');if(p.classList.contains('show')&&!p.contains(e.target))closeDpop();});
function rebind(){document.querySelectorAll('#pv [data-cb]').forEach(bindB);}

/* ─── 씬 적용 ─── */
function applyScene(type){
  var sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return alert('드래그해주세요');
  snapUndo();
  var range=sel.getRangeAt(0);var css=getCSS(type);var cn='calli-'+type;
  try{var sp=document.createElement('span');sp.className=cn;sp.style.cssText=css;range.surroundContents(sp);}
  catch(e){var frag=range.extractContents();wt(frag,cn,css);range.insertNode(frag);}
  sel.removeAllRanges();
}
function wt(node,cn,css){
  if(node.nodeType===Node.TEXT_NODE){if(node.textContent.trim()){var sp=document.createElement('span');sp.className=cn;sp.style.cssText=css;sp.appendChild(node.cloneNode(true));node.parentNode.replaceChild(sp,node);}}
  else Array.from(node.childNodes).forEach(function(c){wt(c,cn,css);});
}
function removeScene(){document.querySelectorAll('#pv span[class^="calli-"]').forEach(function(sp){var pa=sp.parentNode;while(sp.firstChild)pa.insertBefore(sp.firstChild,sp);pa.removeChild(sp);});}

function populateSel(){
  var s=document.getElementById('cs');s.innerHTML='<option value="">챕터 선택...</option>';
  var items=D.toc.length?D.toc:D.files.map(function(h,i){return{title:(i+1)+'',href:h};});
  items.forEach(function(item){if(item.href)s.innerHTML+='<option value="'+es(item.href)+'">'+es(item.title)+'</option>';});
}
function loadChap(){
  var href=document.getElementById('cs').value;if(!href)return;
  var clean=href.split('#')[0];
  var key=Object.keys(zip.files).find(function(k){return k.endsWith(clean);});
  if(!key)return alert('파일을 찾을 수 없습니다');
  chapPath=key;
  zip.file(key).async('string').then(function(html){
    var headStyles=[];
    var styleRe=/<style[^>]*>([\s\S]*?)<\/style>/gi;var sm;
    while((sm=styleRe.exec(html))!==null)headStyles.push(sm[1]);
    var m=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    var bodyContent=m?m[1]:html;
    // head 스타일은 pv 기본 글씨 크기에 영향 안 주도록 scoped
    var styleTag=headStyles.length?'<style scoped>'+headStyles.join('\n')+'</style>':'';
    document.getElementById('pv').innerHTML=styleTag+bodyContent;
    rebind();
    undoStack=[styleTag+bodyContent];redoStack=[];updateUndoBtns();
  });
}
function saveChap(){
  if(!chapPath)return alert('챕터가 없습니다');
  var body=document.getElementById('pv').innerHTML
    .replace(/<br>/gi,'<br/>').replace(/<hr>/gi,'<hr/>')
    .replace(/<img([^>]*)(?<!\/)>/gi,'<img$1/>').replace(/&nbsp;/g,'&#160;');
  zip.file(chapPath).async('string').then(function(html){
    html=html.replace(/(<body[^>]*>)([\s\S]*?)(<\/body>)/i,'$1\n'+body+'\n$3');
    zip.file(chapPath,html);
    toast('챕터 저장 완료 ✅');
  });
}

function saveEpub(){
  toast('빌드 중...');
  zip.file(opfPath).async('string').then(function(opfStr){
    opfStr=opfStr.replace(/(<dc:title[^>]*>)[^<]*(<\/dc:title>)/i,'$1'+D.title+'$2');
    opfStr=opfStr.replace(/(<dc:creator[^>]*>)[^<]*(<\/dc:creator>)/i,'$1'+D.author+'$2');
    zip.file(opfPath,opfStr);
    var css=D.classCss;
    var promises=[];
    if(css){
      D.files.forEach(function(href){
        var fp=opfBase+href;var f=zip.file(fp);if(!f)return;
        promises.push(f.async('string').then(function(h){
          if(!h.includes('</head>'))return;
          h=h.replace(/<style[^>]*>[\s\S]*?<!--calli-->[\s\S]*?<\/style>/g,'');
          h=h.replace('</head>','<style>\n'+css+'\n<!--calli-->\n</style>\n</head>');
          zip.file(fp,h);
        }));
      });
    }
    Promise.all(promises).then(function(){
      zip.file('mimetype').async('string').then(function(mc){
        var out=new JSZip();
        out.file('mimetype',mc,{compression:'STORE'});
        var ps=[];
        Object.entries(zip.files).forEach(function(e){
          var path=e[0],file=e[1];
          if(path==='mimetype'||file.dir)return;
          ps.push(file.async('uint8array').then(function(data){out.file(path,data,{compression:'DEFLATE',compressionOptions:{level:6}});}));
        });
        Promise.all(ps).then(function(){
          out.generateAsync({type:'blob',mimeType:'application/epub+zip'}).then(function(blob){
            var n=D.title.replace(/[^\w\uAC00-\uD7A3]/g,'_');
            var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n+'_편집본.epub';document.body.appendChild(a);a.click();document.body.removeChild(a);
            toast('저장 완료! ✅');
          });
        });
      });
    });
  });
}

var curSkColor='#111';
function openStrikeModal(){curSkColor='#111';document.querySelectorAll('.sk-btn').forEach(function(b,i){b.style.borderColor=i===0?'var(--p)':'var(--bd)';});document.getElementById('strikeModal').classList.remove('hidden');}
function selSk(btn,c){document.querySelectorAll('.sk-btn').forEach(function(b){b.style.borderColor='var(--bd)';});btn.style.borderColor='var(--p)';curSkColor=c;}
function insertStrike(){
  var tx=document.getElementById('strike_text').value||'취소선 텍스트';
  var c=curSkColor;
  var html='<span style="text-decoration:line-through;text-decoration-color:'+c+';text-decoration-thickness:1.5px;color:'+c+';">'+tx+'</span>';
  insertRaw(html);document.getElementById('strikeModal').classList.add('hidden');document.getElementById('strike_text').value='';
}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

/* ─── 장식선 ─── */
var DECO_LINES=[
  '════════════════════',
  '〰〰〰〰〰〰〰〰〰〰〰',
  '⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯',
  '────────────────────',
  '⋯ ⋯ ⋯ ⋯ ⋯ ⋯ ⋯ ⋯ ⋯',
  '┈┈┈┈┈┈┈┈┈┈┈┈┈',
  '┄┄┄┄┄┄┄┄┄┄┄┄┄',
  '━━━━━━━━━━━━━━━━━━━━',
  '╴╴╴╴╴╴╴╴╴╴╴╴╴╴╴',
  '• ───────────────── •',
  '✦ ─────────────── ✦',
  '◆ ─────────────── ◆',
  '◇ ─────────────── ◇',
  '❖ ─────────────── ❖',
  '╭──────────────────╮',
  '╰──────────────────╯',
  '┌──────────────────┐',
  '└──────────────────┘'
];
function buildDecoLines(){
  var w=document.getElementById('decoLines');if(!w)return;
  DECO_LINES.forEach(function(line){
    var btn=document.createElement('button');
    btn.textContent=line;
    btn.style.cssText='width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:12px;font-family:monospace;cursor:pointer;text-align:center;letter-spacing:0;overflow:hidden;white-space:nowrap;';
    btn.addEventListener('click',function(){
      navigator.clipboard.writeText(line).then(function(){
        toast('장식선 복사됨 ✅');
      }).catch(function(){
        var ta=document.createElement('textarea');ta.value=line;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        toast('장식선 복사됨 ✅');
      });
    });
    btn.addEventListener('touchstart',function(){btn.style.background='rgba(124,106,181,.25)';btn.style.borderColor='var(--p)';},{passive:true});
    btn.addEventListener('touchend',function(){btn.style.background='var(--card2)';btn.style.borderColor='var(--bd)';},{passive:true});
    w.appendChild(btn);
  });
}

window.onload=function(){buildGrads();buildDecoLines();};
</script>
