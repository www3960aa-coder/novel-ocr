<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>캘리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--p:#a881af;--p2:#c9a8d0;--pl:#ede4f5;--bg:#f5efff;--card:#fff;--tx:#333;--bd:#e0d5ee;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:14px;}

/* ── 오버레이 ── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:none;}
#ov.show{display:block;}

/* ── 왼쪽: 씬 설정 패널 ── */
#sideL{position:fixed;left:0;top:0;bottom:0;width:272px;background:var(--card);z-index:600;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;}
#sideL.open{transform:translateX(0);}
.ph{padding:11px 14px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;flex-shrink:0;}
.px{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 5px;}
.pb{flex:1;overflow-y:auto;padding:10px 11px;}

/* ── 오른쪽: 블록 패널 ── */
#sideR{position:fixed;right:0;top:0;bottom:0;width:198px;background:var(--card);z-index:600;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;border-left:1px solid var(--bd);}
#sideR.open{transform:translateX(0);}
.bps{margin-bottom:11px;}
.bpt{font-size:10px;font-weight:700;color:var(--p2);letter-spacing:.6px;margin-bottom:4px;}
.bpb{display:block;width:100%;padding:8px 9px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:3px;color:#444;line-height:1.3;}
.bpb small{display:block;font-size:10px;color:#aaa;font-weight:400;margin-top:1px;}
.bpb:active{background:var(--pl);border-color:var(--p);}

/* ── 헤더 ── */
#topbar{background:var(--card);border-bottom:1px solid var(--bd);padding:7px 11px 0;flex-shrink:0;}
#tr1{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.tb{background:var(--pl);color:var(--p);border:none;border-radius:7px;padding:7px 10px;font-size:15px;cursor:pointer;flex-shrink:0;line-height:1;}
#tbf{font-size:11px;color:#999;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tbopen{background:var(--p);color:#fff;border:none;border-radius:16px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
.tab-bar{display:flex;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:9px 13px;border:none;background:transparent;color:#999;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--p);border-bottom-color:var(--p);}
.tab-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ── 씬 바 ── */
#sb{background:var(--card);border-bottom:1px solid var(--bd);padding:6px 10px;display:none;flex-shrink:0;align-items:center;gap:5px;}
#sb.show{display:flex;}
.sc{flex:1;padding:9px 4px;border-radius:7px;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
#brem{flex:0 0 auto;padding:9px 10px;border-radius:7px;border:1.5px solid var(--p);background:transparent;color:var(--p);font-size:12px;font-weight:700;cursor:pointer;}
#bcfg{background:var(--pl);color:var(--p);border:none;border-radius:7px;padding:9px 9px;font-size:13px;cursor:pointer;flex-shrink:0;line-height:1;}
#bblk{background:var(--p);color:#fff;border:none;border-radius:7px;padding:9px 9px;font-size:13px;cursor:pointer;flex-shrink:0;line-height:1;}

/* ── 메인 ── */
#main{flex:1;overflow-y:auto;padding:11px;}
.tc{display:none;}.tc.active{display:block;}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);}
.ct{font-size:12px;font-weight:700;color:var(--p);margin-bottom:8px;}

/* ── 버튼 ── */
.btn{display:block;width:100%;background:var(--p);color:#fff;border:none;padding:12px;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.btn:disabled{background:var(--pl);color:#aaa;}
.bsm{display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border-radius:7px;background:var(--p);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;}
.bsm.g{background:transparent;color:var(--p);border:1.5px solid var(--p);}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.brow .bsm{flex:1;}

/* ── 폼 ── */
label{display:block;font-size:11px;color:#888;margin-bottom:3px;margin-top:9px;}
label:first-child{margin-top:0;}
input[type=text],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:#fafafa;}
input[type=color]{width:100%;height:38px;padding:2px 5px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}

/* ── 아코디언 ── */
.acc{border:1px solid var(--bd);border-radius:8px;margin-bottom:7px;overflow:hidden;}
.ach{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--pl);cursor:pointer;font-size:12px;font-weight:600;color:var(--p);user-select:none;}
.ach .ar{transition:transform .18s;font-size:10px;}
.ach.open .ar{transform:rotate(180deg);}
.acb{padding:10px;display:none;background:var(--card);}
.acb.open{display:block;}

/* ── 씬 그룹 ── */
.sg{border:1px solid var(--bd);border-radius:8px;margin-bottom:7px;overflow:hidden;}
.sgh{padding:9px 11px;background:var(--pl);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
.sgb{display:none;padding:10px;}.sgb.open{display:block;}

/* ── 목차 ── */
.tl{max-height:50vh;overflow-y:auto;}
.ti{display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;margin-bottom:4px;background:#fafafa;}
.ti input{flex:1;padding:5px 7px;font-size:12px;margin:0;border:none;background:transparent;}
.tib{display:flex;gap:3px;flex-shrink:0;}
.tib button{width:24px;height:24px;border:none;border-radius:5px;background:var(--pl);color:var(--p);font-size:10px;cursor:pointer;}
.tib button:last-child{background:#fce4ec;color:#c62828;}

/* ── 본문 ── */
#pv{border:2px dashed var(--p2);border-radius:9px;padding:11px;min-height:180px;font-size:14px;line-height:1.8;background:#fff;margin:7px 0;outline:none;}

/* ── 빠른 블록 그리드 ── */
.ibg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px;}
.ibb{padding:8px 4px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:10px;font-weight:600;cursor:pointer;text-align:center;line-height:1.4;color:#444;}
.ibb:active{background:var(--pl);border-color:var(--p);}

/* ── 삭제 팝오버 (삭제만) ── */
#dpop{position:fixed;z-index:700;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.16);display:none;width:180px;}
#dpop.show{display:block;}
#dpop .dpt{font-size:11px;color:#aaa;margin-bottom:8px;}
#dpop .ddel{width:100%;padding:10px;background:#fce4ec;color:#c62828;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
#dpop-x{position:absolute;top:7px;right:8px;background:none;border:none;font-size:14px;color:#aaa;cursor:pointer;}

/* ── 플로팅 저장 ── */
#fab{position:fixed;bottom:18px;right:16px;z-index:200;background:var(--p);color:#fff;border:none;border-radius:50px;padding:12px 18px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(168,129,175,.45);cursor:pointer;display:none;}
#fab.show{display:block;}

/* ── 모달 ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:800;display:flex;align-items:flex-end;}
.mbg.hidden{display:none;}
.ms{background:var(--card);border-radius:18px 18px 0 0;padding:15px 13px 26px;width:100%;max-height:78vh;overflow-y:auto;}
.mt{font-size:14px;font-weight:700;color:var(--p);margin-bottom:12px;text-align:center;}
.mo{display:flex;align-items:center;gap:9px;padding:11px;border-radius:9px;border:1.5px solid var(--bd);margin-bottom:7px;cursor:pointer;font-size:13px;font-weight:600;}
.mo:active{background:var(--pl);}
.mo input[type=radio]{accent-color:var(--p);width:16px;height:16px;}

/* ── 커뮤 빠른입력 ── */
.rf{display:flex;gap:5px;margin-bottom:4px;align-items:center;}
.rf input{flex:1;padding:8px 9px;border:1px solid var(--bd);border-radius:7px;font-size:12px;}
.rf input.nick{max-width:85px;}
.rf .rdl{width:26px;height:26px;border:none;border-radius:6px;background:#fce4ec;color:#c62828;font-size:12px;cursor:pointer;flex-shrink:0;}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;}
.tp button{padding:7px 5px;border-radius:7px;border:1.5px solid var(--bd);font-size:11px;font-weight:600;cursor:pointer;line-height:1.3;}

.ib{background:var(--pl);border-radius:7px;padding:10px 12px;font-size:12px;line-height:1.9;color:#555;}
.hidden{display:none!important;}
</style>
</head>
<body>
<input type="file" id="epubInput" accept=".epub" class="hidden">
<div id="ov" onclick="closeAll()"></div>

<!-- 왼쪽: 씬 설정 -->
<div id="sideL">
  <div class="ph">⚙️ 씬 스타일 설정<button class="px" onclick="closeSide()">✕</button></div>
  <div class="pb">
    <div class="sg">
      <div class="sgh" onclick="tsg(this)"><span id="dM" style="width:12px;height:12px;border-radius:50%;background:#888;display:inline-block;flex-shrink:0;"></span>회상 씬</div>
      <div class="sgb">
        <div class="g2"><div><label>글자색</label><input type="color" id="mC" value="#888888" oninput="us('memory','color',this.value)"></div><div><label>글자 뒤 배경</label><input type="color" id="mB" value="#ffffff" oninput="us('memory','bg',this.value)"></div></div>
        <div class="g3" style="margin-top:6px;"><div><label>굵기</label><select id="mW" onchange="us('memory','bold',this.value)"><option value="normal">보통</option><option value="bold">굵게</option></select></div><div><label>기울임</label><select id="mI" onchange="us('memory','italic',this.value)"><option value="italic" selected>켜짐</option><option value="normal">꺼짐</option></select></div><div><label>크기</label><input type="text" id="mS" placeholder="기본" oninput="us('memory','size',this.value)" style="padding:7px 7px;font-size:12px;"></div></div>
        <div style="margin-top:8px;"><label style="font-size:10px;color:#aaa;">그라디언트</label><div id="gM" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;"></div></div>
      </div>
    </div>
    <div class="sg">
      <div class="sgh" onclick="tsg(this)"><span id="dN" style="width:12px;height:12px;border-radius:50%;background:#5c6bc0;display:inline-block;flex-shrink:0;"></span>독백 씬</div>
      <div class="sgb">
        <div class="g2"><div><label>글자색</label><input type="color" id="nC" value="#5c6bc0" oninput="us('mono','color',this.value)"></div><div><label>글자 뒤 배경</label><input type="color" id="nB" value="#ffffff" oninput="us('mono','bg',this.value)"></div></div>
        <div class="g3" style="margin-top:6px;"><div><label>굵기</label><select id="nW" onchange="us('mono','bold',this.value)"><option value="bold" selected>굵게</option><option value="normal">보통</option></select></div><div><label>기울임</label><select id="nI" onchange="us('mono','italic',this.value)"><option value="normal" selected>꺼짐</option><option value="italic">켜짐</option></select></div><div><label>크기</label><input type="text" id="nS" placeholder="기본" oninput="us('mono','size',this.value)" style="padding:7px 7px;font-size:12px;"></div></div>
        <div style="margin-top:8px;"><label style="font-size:10px;color:#aaa;">그라디언트</label><div id="gN" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;"></div></div>
      </div>
    </div>
    <div class="sg">
      <div class="sgh" onclick="tsg(this)"><span id="dE" style="width:12px;height:12px;border-radius:50%;background:#e91e63;display:inline-block;flex-shrink:0;"></span>강조 씬</div>
      <div class="sgb">
        <div class="g2"><div><label>글자색</label><input type="color" id="eC" value="#e91e63" oninput="us('emph','color',this.value)"></div><div><label>글자 뒤 배경</label><input type="color" id="eB" value="#ffffff" oninput="us('emph','bg',this.value)"></div></div>
        <div class="g3" style="margin-top:6px;"><div><label>굵기</label><select id="eW" onchange="us('emph','bold',this.value)"><option value="bold" selected>굵게</option><option value="normal">보통</option></select></div><div><label>기울임</label><select id="eI" onchange="us('emph','italic',this.value)"><option value="normal" selected>꺼짐</option><option value="italic">켜짐</option></select></div><div><label>크기</label><input type="text" id="eS" placeholder="기본" oninput="us('emph','size',this.value)" style="padding:7px 7px;font-size:12px;"></div></div>
        <div style="margin-top:8px;"><label style="font-size:10px;color:#aaa;">그라디언트</label><div id="gE" style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;"></div></div>
      </div>
    </div>
    <!-- 상태창 템플릿 -->
    <div style="margin-top:14px;">
      <div style="font-size:10px;font-weight:700;color:var(--p2);letter-spacing:.6px;margin-bottom:7px;">상태창 템플릿 삽입</div>
      <button onclick="ib('status_basic')" style="display:block;width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;color:#444;">📊 기본 상태창<br><small style="color:#aaa;font-weight:400;">이름/레벨/스탯</small></button>
      <button onclick="ib('status_skill')" style="display:block;width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;color:#444;">⚔️ 스킬창<br><small style="color:#aaa;font-weight:400;">스킬 목록 형식</small></button>
      <button onclick="ib('status_quest')" style="display:block;width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;color:#444;">📜 퀘스트창<br><small style="color:#aaa;font-weight:400;">미션/보상 형식</small></button>
      <button onclick="ib('status_alert')" style="display:block;width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;color:#444;">🔔 시스템 알림<br><small style="color:#aaa;font-weight:400;">레벨업/달성 팝업</small></button>
      <button onclick="ib('status_shop')" style="display:block;width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;color:#444;">🏪 상점창<br><small style="color:#aaa;font-weight:400;">아이템 목록 형식</small></button>
      <button onclick="ib('status_inventory')" style="display:block;width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:#fafafa;font-size:12px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;color:#444;">🎒 인벤토리<br><small style="color:#aaa;font-weight:400;">소지품 목록 형식</small></button>
    </div>
  </div>
</div>

<!-- 오른쪽: 블록 전체 목록 -->
<div id="sideR">
  <div class="ph">📦 블록 전체<button class="px" onclick="closeBlock()">✕</button></div>
  <div class="pb">
    <div class="bps"><div class="bpt">── 카카오톡 ──</div>
      <button class="bpb" onclick="ib('kakao_recv')">◀ 받은 메시지</button>
      <button class="bpb" onclick="ib('kakao_sent')">▶ 보낸 메시지</button>
      <button class="bpb" onclick="ib('kakao_date')">📅 날짜 구분선</button>
      <button class="bpb" onclick="ib('kakao_wrap')">💬 대화창 래퍼</button>
    </div>
    <div class="bps"><div class="bpt">── 커뮤·댓글 ──</div>
      <button class="bpb" onclick="ib('comm_full')">📋 커뮤 통합 (칼라형)<small>게시글+댓글버튼+댓글 한 덩어리</small></button>
      <button class="bpb" onclick="ib('comm_full2')">📋 커뮤 통합 (기본형)<small>제목:내용/댓글1:내용 형식</small></button>
      <button class="bpb" onclick="ib('reply')">↩ 대댓글 한 줄</button>
    </div>
    <div class="bps"><div class="bpt">── SNS ──</div>
      <button class="bpb" onclick="ib('twitter')">🐦 트위터/X</button>
      <button class="bpb" onclick="ib('insta')">📸 인스타 DM</button>
      <button class="bpb" onclick="ib('youtube')">▶ 유튜브 댓글</button>
      <button class="bpb" onclick="ib('facebook')">👍 페이스북</button>
    </div>
    <div class="bps"><div class="bpt">── 박스 ──</div>
      <button class="bpb" onclick="ib('box')">🗂 시스템 박스</button>
      <button class="bpb" onclick="ib('noti')">🔔 앱 알림</button>
      <button class="bpb" onclick="ib('email')">📧 이메일</button>
      <button class="bpb" onclick="ib('letter')">✉️ 편지/문서</button>
    </div>
  </div>
</div>

<!-- 헤더 -->
<div id="topbar">
  <div id="tr1">
    <button class="tb" id="btnMenu" onclick="openSide()">☰</button>
    <div id="tbf">파일을 열어주세요</div>
    <button class="tb" id="btnBlk" onclick="toggleBlock()" style="background:var(--p);color:#fff;">📦</button>
    <button id="tbopen" onclick="document.getElementById('epubInput').click()">열기</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn" id="tToc"  disabled onclick="sw('tocTab')">📖 목차</button>
    <button class="tab-btn" id="tEdit" disabled onclick="sw('editTab')">✏️ 본문 편집</button>
    <button class="tab-btn" id="tCss"  disabled onclick="sw('cssTab')">🎨 화수 CSS</button>
  </div>
</div>

<!-- 씬 바 -->
<div id="sb">
  <button class="sc" id="bM" style="background:#888;" onclick="applyScene('memory')">회상</button>
  <button class="sc" id="bN" style="background:#5c6bc0;" onclick="applyScene('mono')">독백</button>
  <button class="sc" id="bE" style="background:#e91e63;" onclick="applyScene('emph')">강조</button>
  <button id="brem" onclick="removeScene()">제거</button>
  <button id="bcfg" onclick="openSide()">⚙️</button>
  <button id="bblk" onclick="toggleBlock()">📦</button>
</div>

<div id="main">

<!-- 목차 탭 -->
<div id="tocTab" class="tc">
  <div id="ic" class="card hidden"><div id="ib2" class="ib"></div></div>
  <div class="card"><div class="brow" style="margin:0;"><button class="bsm" style="flex:2;" onclick="openTocM()">📋 자동 매핑</button><button class="bsm g" onclick="saveToc()">임시 저장</button></div></div>
  <div class="acc"><div class="ach" onclick="tacc(this)">⚡ 일괄 찾기/바꾸기 <span class="ar">▼</span></div>

<script>
/* ─── 전역 ─── */
let zip=null,opfPath='',opfBase='',opfDoc=null,chapPath='';
let D={title:'',author:'',files:[],toc:[],classCss:'',hdrCss:''};
let fname='';
const PR=new DOMParser();

/* ─── 패널 제어 ─── */
function openSide(){document.getElementById('sideL').classList.add('open');document.getElementById('ov').classList.add('show');}
function closeSide(){document.getElementById('sideL').classList.remove('open');if(!document.getElementById('sideR').classList.contains('open'))document.getElementById('ov').classList.remove('show');}
function toggleBlock(){
  const r=document.getElementById('sideR');
  if(r.classList.contains('open')){closeBlock();}
  else{r.classList.add('open');document.getElementById('ov').classList.add('show');}
}
function closeBlock(){document.getElementById('sideR').classList.remove('open');if(!document.getElementById('sideL').classList.contains('open'))document.getElementById('ov').classList.remove('show');}
function closeAll(){document.getElementById('sideL').classList.remove('open');document.getElementById('sideR').classList.remove('open');document.getElementById('ov').classList.remove('show');}
function tsg(h){h.nextElementSibling.classList.toggle('open');}
function tacc(h){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open');}

/* ─── 탭 ─── */
const TM={tocTab:'tToc',editTab:'tEdit',cssTab:'tCss'};
function sw(id){
  document.querySelectorAll('.tc').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
  const t=TM[id];if(t)document.getElementById(t).classList.add('active');
  document.getElementById('sb').classList.toggle('show',id==='editTab');
}

/* ─── 그라디언트 ─── */
const GR={none:null,title:'linear-gradient(135deg,#d0ccfa,#addfe9,#dca0e3)',strawberry:'linear-gradient(180deg,#e8534a,#ffb5a7)',pink_coral:'linear-gradient(180deg,#f472b6,#e8534a)',lilac_pink:'linear-gradient(180deg,#c084fc,#f472b6)',cherry_lav:'linear-gradient(180deg,#ffb7c5,#c4b5fd)',rose_mint:'linear-gradient(180deg,#f472b6,#34d399,#a78bfa)',coral_sky:'linear-gradient(180deg,#f97316,#38bdf8,#a855f7)',lp_gold:'linear-gradient(90deg,#c4b5fd,#f9a8d4,#fcd34d)',mint_sky:'linear-gradient(90deg,#6ee7b7,#7dd3fc,#c4b5fd)',ocean:'linear-gradient(180deg,#4facfe,#00f2c3)',sage:'linear-gradient(180deg,#b8e0b0,#3ecf8e)',sunset:'linear-gradient(180deg,#fc5c7d,#6a3093)',indigo:'linear-gradient(180deg,#667eea,#764ba2)',lemon:'linear-gradient(180deg,#fde047,#a3e635)',teal:'linear-gradient(180deg,#14b8a6,#1e3a8a)',peach:'linear-gradient(90deg,#fda4af,#fb7185,#c4b5fd)',gold:'linear-gradient(90deg,#fcd34d,#fb923c,#f9a8d4)',purple:'linear-gradient(90deg,#a78bfa,#f9a8d4,#6ee7b7)',rainbow:'linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff)',berry:'linear-gradient(180deg,#ec4899,#10b981,#f59e0b)'};
const GL=[['none','단색'],['title','라벤더민트'],['strawberry','딸기크림'],['pink_coral','핑크코랄'],['lilac_pink','라일락핑크'],['cherry_lav','벚꽃라벤더'],['rose_mint','로즈민트'],['coral_sky','코랄스카이'],['lp_gold','라일락골드'],['mint_sky','민트스카이'],['ocean','오션'],['sage','세이지'],['sunset','선셋'],['indigo','인디고'],['lemon','레몬라임'],['teal','틸네이비'],['peach','피치로즈'],['gold','골드코랄'],['purple','퍼플핑크'],['rainbow','🌈무지개'],['berry','베리민트']];

function buildGrads(){
  const ids={memory:'gM',mono:'gN',emph:'gE'};
  Object.entries(ids).forEach(([t,wid])=>{
    const w=document.getElementById(wid);if(!w)return;w.innerHTML='';
    GL.forEach(([k,lb])=>{
      const g=GR[k];const btn=document.createElement('button');
      btn.style.cssText='padding:5px 3px;border-radius:5px;cursor:pointer;border:1.5px solid transparent;font-size:10px;text-align:center;line-height:1.3;word-break:keep-all;';
      if(k==='none'){btn.style.background='#f0eaf7';btn.style.color='var(--p)';btn.style.borderColor='var(--p)';}
      else if(g){btn.style.background=g;btn.style.color='transparent';btn.style.webkitBackgroundClip='text';btn.style.backgroundClip='text';btn.style.fontWeight='700';}
      btn.textContent=lb;btn.onclick=()=>setGrad(t,k);
      w.appendChild(btn);
    });
  });
}

const SS={
  memory:{mode:'color',color:'#888888',bg:'#fff',grad:'none',bold:'normal',italic:'italic',size:''},
  mono:{mode:'color',color:'#5c6bc0',bg:'#fff',grad:'none',bold:'bold',italic:'normal',size:''},
  emph:{mode:'color',color:'#e91e63',bg:'#fff',grad:'none',bold:'bold',italic:'normal',size:''}
};
function getCSS(t){
  const s=SS[t];let c='';
  if(s.mode==='grad'&&GR[s.grad])c=`background:${GR[s.grad]};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;`;
  else c=`color:${s.color}!important;`;
  return`${c}background-color:${s.bg}!important;font-weight:${s.bold}!important;font-style:${s.italic}!important;${s.size?'font-size:'+s.size+'!important;':''}`;
}
function us(t,f,v){SS[t][f]=v;if(f==='color')SS[t].mode='color';syncB();}
function setGrad(t,k){SS[t].mode=k==='none'?'color':'grad';SS[t].grad=k;syncB();}
function syncB(){
  const m={memory:['bM','dM'],mono:['bN','dN'],emph:['bE','dE']};
  Object.entries(m).forEach(([t,[bi,di]])=>{
    const s=SS[t];const dc=s.mode==='grad'&&GR[s.grad]?GR[s.grad]:s.color;
    const btn=document.getElementById(bi);if(btn)btn.style.background=dc;
    const dot=document.getElementById(di);if(dot)dot.style.background=s.mode==='grad'?'linear-gradient(90deg,#f472b6,#a78bfa)':s.color;
  });
  D.classCss=`.calli-memory{${getCSS('memory')}}.calli-mono{${getCSS('mono')}}.calli-emph{${getCSS('emph')}}`;
}

/* ─── EPUB 열기 ─── */
document.getElementById('epubInput').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;
  fname=f.name.replace(/\.epub$/i,'');
  document.getElementById('tbf').textContent=f.name;
  const r=new FileReader();r.onload=ev=>JSZip.loadAsync(ev.target.result).then(z=>{zip=z;analyze(z);}).catch(()=>alert('읽기 실패'));
  r.readAsArrayBuffer(f);
});

async function analyze(z){
  D={title:fname,author:'',files:[],toc:[],classCss:'',hdrCss:''};
  try{
    const cx=await z.file('META-INF/container.xml').async('string');
    const cd=PR.parseFromString(cx,'application/xml');
    opfPath=cd.querySelector('rootfile').getAttribute('full-path');
    opfBase=opfPath.substring(0,opfPath.lastIndexOf('/')+1);
    const ox=await z.file(opfPath).async('string');
    opfDoc=PR.parseFromString(ox,'application/xml');
    const cr=opfDoc.querySelector('creator');if(cr)D.author=cr.textContent;
    const its=Array.from(opfDoc.querySelectorAll('item'));
    its.forEach(it=>{const mt=it.getAttribute('media-type');if(mt==='application/xhtml+xml'||mt==='text/html')D.files.push(it.getAttribute('href'));});
    let ok=false;
    const nav=its.find(it=>it.getAttribute('properties')==='nav'||(it.getAttribute('id')||'').toLowerCase().includes('nav'));
    const ncx=its.find(it=>it.getAttribute('media-type')==='application/x-dtbncx+xml');
    if(nav){try{const nx=await z.file(opfBase+nav.getAttribute('href')).async('string');const nd=PR.parseFromString(nx,'application/xhtml+xml');const an=nd.querySelectorAll('nav a');if(an.length){D.toc=Array.from(an).map((a,i)=>({id:`t${i}`,title:a.textContent.trim(),href:a.getAttribute('href'),full:a.textContent.trim()}));ok=true;}}catch(e){}}
    if(!ok&&ncx){try{const nx=await z.file(opfBase+ncx.getAttribute('href')).async('string');const nd=PR.parseFromString(nx,'application/xml');const np=nd.querySelectorAll('navPoint');if(np.length){D.toc=Array.from(np).map((n,i)=>{const tx=n.querySelector('text')?.textContent.trim()||`${i+1}화`;return{id:`t${i}`,title:tx,href:n.querySelector('content')?.getAttribute('src')||'',full:tx};});ok=true;}}catch(e){}}
    if(!ok)D.toc=D.files.map((h,i)=>({id:`t${i}`,title:`${i+1}화`,href:h,full:`${i+1}화`}));
    ['tToc','tEdit','tCss'].forEach(id=>document.getElementById(id).disabled=false);
    document.getElementById('fab').classList.add('show');
    document.getElementById('ib2').innerHTML=`📂 <b>${fname}</b> · 📄 ${D.files.length}개`;
    document.getElementById('ic').classList.remove('hidden');
    renderToc();populateSel();syncB();sw('tocTab');
  }catch(err){console.error(err);alert('분석 실패: '+err.message);}
}

/* ─── 목차 ─── */
function es(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderToc(){const tl=document.getElementById('tl');tl.innerHTML='';D.toc.forEach((item,i)=>{tl.innerHTML+=`<div class="ti"><input type="text" value="${es(item.title)}" id="ti${i}"><div class="tib"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button><button onclick="dl(${i})">✕</button></div></div>`;});}
function sts(){D.toc.forEach((item,i)=>{const el=document.getElementById(`ti${i}`);if(el)item.title=el.value;});}
function mv(i,d){if(i+d<0||i+d>=D.toc.length)return;sts();[D.toc[i],D.toc[i+d]]=[D.toc[i+d],D.toc[i]];renderToc();}
function dl(i){sts();D.toc.splice(i,1);renderToc();}
function addToc(){sts();D.toc.push({title:'새 항목',href:'',full:'새 항목'});renderToc();}
function saveToc(){sts();alert('임시 저장 완료');}
function prvRep(){sts();const f=document.getElementById('ft').value,r=document.getElementById('rt').value;if(!f)return alert('찾을 문자 입력');let t='[미리보기]\n\n';D.toc.slice(0,5).forEach(item=>{t+=`${item.title} → ${item.title.split(f).join(r)}\n`;});alert(t);}
function doRep(){sts();const f=document.getElementById('ft').value,r=document.getElementById('rt').value;if(!f)return;D.toc.forEach(item=>{item.title=item.title.split(f).join(r);});renderToc();}
function openTocM(){document.getElementById('tocModal').classList.remove('hidden');}
function doAutoToc(){const m=document.querySelector('input[name="tm"]:checked').value;D.toc=D.files.map((href,i)=>{const ex=D.toc[i];const t=(m==='keep'&&ex?.full)?ex.full:`${i+1}화`;return{id:`t${i}`,title:t,href,full:ex?.full||t};});renderToc();document.getElementById('tocModal').classList.add('hidden');}

let activeB=null;
function insertRaw(html){
  const pv=document.getElementById('pv');pv.focus();
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const bel=tmp.firstElementChild;if(bel)bindB(bel);
  const sel=window.getSelection();
  if(sel.rangeCount&&pv.contains(sel.anchorNode)){
    const r=sel.getRangeAt(0);r.collapse(false);
    const frag=document.createDocumentFragment();let node;
    while((node=tmp.firstChild))frag.appendChild(node);
    r.insertNode(frag);r.collapse(false);sel.removeAllRanges();sel.addRange(r);
  }else{while(tmp.firstChild)pv.appendChild(tmp.firstChild);}
}
function ib(type){const html=BL[type];if(!html)return;insertRaw(html);closeBlock();}

function bindB(el){
  if(!el||!el.hasAttribute('data-cb'))return;
  el.addEventListener('click',function(e){
    e.stopPropagation();
    activeB=el;
    const pop=document.getElementById('dpop');
    const rect=el.getBoundingClientRect();
    let top=rect.bottom+window.scrollY+6;
    if(top+90>window.innerHeight+window.scrollY)top=rect.top+window.scrollY-90;
    pop.style.top=top+'px';pop.style.left='50%';pop.style.transform='translateX(-50%)';
    pop.classList.add('show');
  });
}
function delBlock(){if(!activeB)return;if(confirm('삭제할까요?')){activeB.remove();activeB=null;closeDpop();}}
function closeDpop(){document.getElementById('dpop').classList.remove('show');activeB=null;}
document.addEventListener('click',e=>{const p=document.getElementById('dpop');if(p.classList.contains('show')&&!p.contains(e.target))closeDpop();});
function rebind(){document.querySelectorAll('#pv [data-cb]').forEach(bindB);}

/* ─── 씬 적용 ─── */
function applyScene(type){
  const sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return alert('드래그해주세요');
  const range=sel.getRangeAt(0);const css=getCSS(type);const cn=`calli-${type}`;
  try{const sp=document.createElement('span');sp.className=cn;sp.style.cssText=css;range.surroundContents(sp);}
  catch(e){const frag=range.extractContents();wt(frag,cn,css);range.insertNode(frag);}
  sel.removeAllRanges();
}
function wt(node,cn,css){
  if(node.nodeType===Node.TEXT_NODE){if(node.textContent.trim()){const sp=document.createElement('span');sp.className=cn;sp.style.cssText=css;sp.appendChild(node.cloneNode(true));node.parentNode.replaceChild(sp,node);}}
  else Array.from(node.childNodes).forEach(c=>wt(c,cn,css));
}
function removeScene(){document.querySelectorAll('#pv span[class^="calli-"]').forEach(sp=>{const pa=sp.parentNode;while(sp.firstChild)pa.insertBefore(sp.firstChild,sp);pa.removeChild(sp);});}

/* ─── 챕터 ─── */
function populateSel(){const s=document.getElementById('cs');s.innerHTML='<option value="">챕터 선택...</option>';const items=D.toc.length?D.toc:D.files.map((h,i)=>({title:`${i+1}`,href:h}));items.forEach(item=>{if(item.href)s.innerHTML+=`<option value="${es(item.href)}">${es(item.title)}</option>`;});}
async function loadChap(){
  const href=document.getElementById('cs').value;if(!href)return;
  const clean=href.split('#')[0];
  const key=Object.keys(zip.files).find(k=>k.endsWith(clean));
  if(!key)return alert('파일을 찾을 수 없습니다');
  chapPath=key;
  const html=await zip.file(key).async('string');
  const m=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  document.getElementById('pv').innerHTML=m?m[1]:html;
  rebind();
}
async function saveChap(){
  if(!chapPath)return alert('챕터가 없습니다');
  const body=document.getElementById('pv').innerHTML
    .replace(/<br>/gi,'<br/>').replace(/<hr>/gi,'<hr/>')
    .replace(/<img([^>]*)(?<!\/)>/gi,'<img$1/>').replace(/&nbsp;/g,'&#160;');
  let html=await zip.file(chapPath).async('string');
  html=html.replace(/(<body[^>]*>)([\s\S]*?)(<\/body>)/i,`$1\n${body}\n$3`);
  zip.file(chapPath,html);alert('저장 완료 ✅');
}

/* ─── 화수 CSS ─── */
function applyCSS(){
  const no=document.getElementById('cssNo').value;
  const sub=document.getElementById('cssSub').value;
  const div=document.getElementById('cssDiv').value;
  D.hdrCss=(no?`.calli-hdr-no{${no}}`:'')+(sub?`.calli-hdr-sub{${sub}}`:'')+(div?`.calli-hdr-div{${div}}`:'');
  alert('확정됐습니다');
}

/* ─── 최종 저장 ─── */
async function saveEpub(){
  const fab=document.getElementById('fab');fab.textContent='빌드 중...';fab.disabled=true;
  try{
    let opfStr=await zip.file(opfPath).async('string');
    opfStr=opfStr.replace(/(<dc:title[^>]*>)[^<]*(<\/dc:title>)/i,`$1${D.title}$2`);
    opfStr=opfStr.replace(/(<dc:creator[^>]*>)[^<]*(<\/dc:creator>)/i,`$1${D.author}$2`);
    zip.file(opfPath,opfStr);
    const css=[D.classCss,D.hdrCss].filter(Boolean).join('\n');
    if(css){for(const href of D.files){const fp=opfBase+href;const f=zip.file(fp);if(!f)continue;let h=await f.async('string');if(!h.includes('</head>'))continue;h=h.replace(/<style[^>]*>[\s\S]*?<!--calli-->[\s\S]*?<\/style>/g,'');h=h.replace('</head>',`<style>\n${css}\n<!--calli-->\n</style>\n</head>`);zip.file(fp,h);}}
    const mime=zip.file('mimetype');const mc=mime?await mime.async('string'):'application/epub+zip';
    const out=new JSZip();out.file('mimetype',mc,{compression:'STORE'});
    for(const [path,file] of Object.entries(zip.files)){if(path==='mimetype'||file.dir)continue;const data=await file.async('uint8array');out.file(path,data,{compression:'DEFLATE',compressionOptions:{level:6}});}
    const blob=await out.generateAsync({type:'blob',mimeType:'application/epub+zip'});
    const n=D.title.replace(/[^\w\uAC00-\uD7A3\u3040-\u30FF]/g,'_');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${n}_편집본.epub`;document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(e){console.error(e);alert('오류: '+e.message);}
  finally{fab.textContent='💾 최종 저장';fab.disabled=false;}
}
