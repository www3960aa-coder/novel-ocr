  rtl/table 트릭으로 떼어놓던 방식 제거. 실제 카톡처럼 내 아이콘 없이 오른쪽 정렬된
  말풍선만 보여줌(아이콘-말풍선이 서로 멀리 떨어져 보이던 버그 수정).
- chat/chat_avatar 스타일의 "내가 보낸 말" 배경색이 무조건 초록으로 고정되어 색상
  스와치를 눌러도 안 바뀌던 버그 수정 - 이제 고른 색상(colorIdx)을 그대로 씀.
- 포스트잇 스타일 옵션 삭제(요청).
- "카톡 말풍선" 옵션 이름을 "말풍선"으로 변경.

[v3 수정 내용]
- "카톡(아이콘 없음)" 스타일 추가. 사용자가 참고로 준 다른 이펍(Sigil로 만든 소설)의
  카톡 구현을 그대로 참고함: 아이콘 없이 말풍선 모양 자체(받은 말=왼쪽 위 모서리만 각짐,
  보낸 말=오른쪽 위 모서리만 각지고 오른쪽 정렬)로 방향을 구분. .kt-bubble/.kt-bubble.left/
  .kt-bubble.right/.kt-name CSS, buildCandHtml의 'kakao' 분기. 색상 스와치 정상 작동.

[v4 수정 내용]

[v6 수정 내용 - 중요: 아래 보호 구간, 다시 되돌리지 말 것]
- 심각한 버그: "카톡(이름 있는 받은 말)"로 내보내기(EPUB 내보내기)하면 실제 메시지 내용이

  el.replaceWith(...)에 넘기고 있었음 - 말풍선(진짜 메시지 텍스트) 쪽은 통째로 버려짐.
  미리보기(renderPreview)는 innerHTML을 그대로 넣는 방식이라 이 버그가 없었기 때문에
  편집 화면에서는 정상으로 보였지만, 실제로 "EPUB 내보내기"한 파일에서만 받은 말 내용이
  통째로 날아가 있었음(사용자가 직접 만든 이펍에서 발견·보고).
  고침: wrapper/w의 모든 자식 노드를 전부 가져오도록 변경(비그룹 후보는
  el.replaceWith(...wrapper.childNodes), 그룹 후보는 w의 모든 자식을 frag에 옮김).
  앞으로 buildCandHtml이 두 개 이상의 최상위 요소를 반환하는 스타일을 추가하더라도
  export 쪽에서 통째로 반영되도록, firstElementChild만 꺼내 쓰는 패턴은 다시 쓰지 말 것.

  사용자가 준 참고 스샷(흰 바탕에 카톡 들어간 예시)과 동일한 느낌이 기본값이 됨.
  부작용 주의: "색상 강조"(문장 속 글자색으로 직접 쓰는 스타일)에서 흰색을 고르면 흰 바탕

  (카톡/말풍선 배경색으로 쓸 때는 흰색 그대로 적용됨 - 다른 용도임, 섞어서 고치지 말 것).
  색상 스와치 UI(colorSwatchesHtml)도 흰색이 선택 안 된 상태일 때 옅은 회색 테두리가 보이게
  고침(안 그러면 패널 배경에 묻혀 안 보였음) - 선택됐을 때는 기존 진한 테두리 그대로 유지.
- 새 스타일 "연락처 알림창"(contact) 추가: 참고 스샷("최성규." 처럼 원형 프로필 아이콘(👤)
  + 이름만 있는 흰 박스)을 그대로 구현. 이름 입력칸 없이 대괄호 본문 전체를 이름/라벨로
  보여줌(.msg-contact/.msg-contact-icon/.msg-contact-name CSS, buildCandHtml의 'contact'
  분기). 문장 속/새 줄 후보 둘 다에서 선택 가능. exportEpub가 주입하는 CSS 마커를
  utsho-editor-css-v7로 올려서, 이미 v4~v6 마커가 박혀 있는 예전 이펍을 다시 열어 내보내도
  새로 추가된 .msg-contact CSS가 누락 없이 들어가게 함.

[v8 수정 내용]
- 스타일 선택 목록에서 "연락처 알림창(프로필 아이콘)"을 끝쪾(라이브 방송 앞)에서 "카톡" 바로
  아래로 옮김(요청).
- 사용자가 다시 스샷으로 "카톡 배경"이 뭘 말한건지 설명함: 말풍선이 페이지에 혼자 떠 있는 게
  아니라, 흰 배경+옅은 테두리의 네모 박스(휴대폰 채팅 캡처처럼 둥근 테두리 박스) 안에 말풍선이
  들어가 있는 모양을 말한 것이었음. 카톡(kakao) 스타일에 이 박스(.kt-box: 흰 배경, 옅은 회색
  테두리, 둥근 모서리, 안쪽 여백)를 추가해서 말풍선(.kt-bubble)을 그 안에 감싸도록 고침(이름표
  <span class="kt-name">는 기존처럼 박스 밖 위에 그대로 둠). 대괄호 하나 = 말풍선 하나 = 박스
  하나(여러 말풍선을 한 박스에 묶는 기능은 아직 없음).
- "저기 선배,오랜만이네 카톡 색"이라고 짚어준 색(스샷에서 실제 피커로 추출: #cfdaf6, 라벤더빛
  페일 블루)으로 팔레트의 "하늘색" 슬롯(세 번째, 기존 #e0f4fd)을 교체함. 순서(흰-회-이 색-...)는
  그대로 유지.
  exportEpub가 주입하는 CSS 마커를 utsho-editor-css-v8로 올려서, 이미 v4~v7 마커가 박혀 있는
  예전 이펍을 다시 열어 내보내도 새로 추가된 .kt-box CSS가 누락 없이 들어가게 함.

[v9 수정 내용]  (이 줄부터는 v9를 만든 세션이 적음 - 뭘 고쳤는지 서로 알 수 있게)
- 카톡(kakao): 이름표(.kt-name)를 박스(.kt-box) 밖 위가 아니라 박스 안쪽 맨 위, 말풍선 바로 위로 옮김
  (예전엔 이름이 흰 배경+테두리 박스 밖으로 튀어나와 있었음). buildCandHtml kakao 분기에서 ${nm}을 .kt-box 안으로.
- 이름 켜기/끄기: 이름 입력칸 옆(내가 보낸 말 체크박스 옆)에 '이름 표시' 체크박스 추가(cand.showName, 기본 켜짐).
  끄면 입력해 둔 이름은 남겨 두고 화면/내보내기에서만 안 보임. chat/kakao/letter/call/live 공통(nameToggleHtml,
  setCandShowName, buildCandHtml의 showN).
- 팔레트(CHAT_COLORS): 맨 앞 흰색을 3번째로 이동(회색 → 파랑 → 흰색 → 분홍...). 기본 선택(colorIdx=0)은 그대로
  '첫 번째 칸'이라 이제 회색이 기본. '색상 강조'에서 흰색을 고르면 회색(#999)으로 보이게 하는 처리는 색값(#ffffff)
  기준이라 순서가 바뀌어도 그대로 동작.
- 쪽지/메시지(letter)·전화 수신(call)·라이브(live) 디자인을 새로 만듦(이모티콘 제거, 인라인 SVG 아이콘 사용):
  letter=알림 배너(앱 아이콘 + '메시지' + 지금 + 보낸 사람 + 내용) -> .nf-*,
  call=수신 화면 카드(사람 아이콘 + 전화 수신 중 + 내용 + 거절(빨강)/수락(초록) 버튼) -> .cl-*,
  live=어두운 헤더(● LIVE 배지 + 이름) 아래 흰 본문 -> .lv-*.
  기존 클래스(.msg-letter/.msg-call/.msg-live)와 이름을 일부러 다르게 해서, v4~v8로 이미 내보낸 예전 이펍의 CSS와
  충돌하지 않음. 새 CSS는 CARD_CSS_V9 상수 하나로 편집창과 내보내기 양쪽에 같이 들어감(따로 복붙하지 말 것).
  SVG는 xmlns="http://www.w3.org/2000/svg" 필수(XHTML에서 innerHTML로 넣을 때 없으면 그림이 안 나옴),
  태그는 전부 self-closing(<path .../>) 으로 쓸 것(XML 파서).
  (편집창 CSS에는 * {box-sizing:border-box}가 있고 EPUB에는 없어서, 아이콘 박스는 box-sizing:content-box를 직접 지정해 양쪽 크기를 맞춤)
  아이콘 위치는 margin이 아니라 padding-top으로 맞춤(첫 자식 margin-top이 부모와 합쳐지는 현상 때문에
  아이콘이 위로 쏠렸음). 전화 카드 문구는 '이름 · 전화 수신 중'(옛 '이름 님에게서'는 줄이 꺾여서 줄임).
  카드 바깥은 display:block+padding, 안쪽 표(display:table;width:100%)에는 padding을 안 줌
  (예전 .msg-letter는 table+width:100%+padding이라 EPUB에서 오른쪽으로 삐져나갈 수 있었음).
- 저장 파일 이름: '수정됨.epub' 대신 OPF의 dc:title(소설 제목)로 저장(bookTitle). 제목이 없으면 올린 파일 이름,
  그것도 없으면 '수정됨'. 파일명에 못 쓰는 글자(\\ / : * ? " < > |)는 공백으로 바꿈.
- exportEpub가 주입하는 CSS 마커를 utsho-editor-css-v9로 올림(v8까지 처리된 이펍을 다시 열어 내보내도 새 CSS 추가).

[v10 수정 내용]
- 사용자가 v9를 다른 세션에서 받아와 전달하면서, v9가 "카톡 이름표가 박스 밖에 떠서 어색하다"는
  지적을 "이름 표시 켜기/끄기 토글"로 해석한 게 오해였다고 정정함 - 실제로는 카톡 말풍선엔
  이름표 자체가 아예 필요 없다는 뜻이었음. 그래서 카톡(kakao) 스타일에서는 showName 토글
  여부와 상관없이 이름표(.kt-name)를 항상 렌더링하지 않도록 뺌(buildCandHtml의 kakao 분기에서
  nm 자체를 제거). 카톡 후보 편집창에서도 이제 "이름" 입력칸/"이름 표시" 체크박스가 안 보이고
  "내가 보낸 말(오른쪽)" 체크박스만 남음(이름 입력 자체가 카톡에서는 더 이상 쓰이지 않으므로).
  쪽지/전화/말풍선/라이브 스타일의 이름 표시·토글 기능(v9)은 그대로 유지 - 카톡에만 적용된 변경.

[v11 수정 내용]
- v10은 또 잘못 이해한 것이었음: 사용자가 원한 건 "이름 입력칸까지 없애고 이름표를 무조건
  안 보이게" 하는 게 아니라, v9가 만든 "이름 표시" 체크박스를 끈(showName===false) 경우에만
  그 후보의 이름표를 안 보이게 하는 것 - 즉 v9의 토글 동작 그대로. v10에서 빼버렸던 카톡의
  이름 입력칸/"이름 표시" 체크박스를 되살리고, buildCandHtml의 kakao 분기도 nameTxt(토글을
  반영한 이름)를 다시 읽어서 .kt-name을 그리도록 원복함. 결과적으로 카톡은 v9와 동일하게
  동작함(토글 켜져 있으면 이름표 보임, 꺼져 있으면 숨김) - v10에서 한 "무조건 삭제"만 되돌림.

[v12 수정 내용]
- "내가 보낸 말 옆에 체크할 수 있는 걸 만들고"가 가리킨 게 이름 토글이 아니라 카톡의
  흰 배경+테두리 박스(.kt-box)를 켰다 껐다 하는 체크박스였다고 사용자가 재정정함. "내가 보낸
  말(오른쪽)" 체크박스 바로 옆에 "배경 박스" 체크박스를 추가(boxToggleHtml/setCandShowBox,
  cand.showBox, 기본 켜짐). 꺼면 그 후보만 박스 없이 말풍선(+이름표, 이름 토글은 별개로 계속
  적용됨)이 바로 뜨는 v7까지의 모양으로 나옴. 대괄호 후보마다 따로 켜고 끌 수 있음.

[v13 수정 내용]
- "이름(선택)" 입력칸은 그대로 두고, 그 옆의 "이름 표시" 체크박스(v9에서 추가된 토글)는
  완전히 삭제(요청). nameToggleHtml/setCandShowName 함수와 cand.showName 분기를 전부 제거,
  buildCandHtml의 nameTxt는 이제 그냥 cand.name을 그대로 씀 - 이름을 적어두면(체크박스 없이)
  항상 보이고, 비워두면 안 보임(v9 이전 방식으로 되돌림). "배경 박스" 체크박스(v12, .kt-box
  on/off)는 이번 요청과 무관하므로 그대로 둠.

[v14 수정 내용]  (v14는 v13을 받아서 이어서 만든 세션이 적음)
- 인용박스(quote, 그림자): 테두리를 팔레트 색(s.border, 흰색을 고르면 흰 테두리였음)이 아니라 항상 검정(#222)으로.
  buildCandHtml quote 분기의 border-color. (깔끔한 네모창(box)은 그대로 팔레트 테두리)
- 새 스타일 '뉴스 기사형'(news): 굵은 검정 윗줄 + NEWS 배지 + 매체명(이름 칸) + '방금 전', 아래에 굵은 헤드라인(내용).
  .nw-* 클래스, 팔레트 배경색 사용. 이름 입력칸이 보이는 스타일 목록에 추가.
- 새 스타일 '영상통화 수신 알림창'(video): 전화(call)와 같은 .cl-* 카드, 문구만 '영상통화 수신 중', 수락 버튼은
  카메라 아이콘(ICON_VIDEO). 이름 입력칸 있음, 팔레트/정렬 사용.
- 새 CSS는 CARD_CSS_V14 상수 하나(편집창 + 내보내기 둘 다에서 씀). 내보내기는 /* utsho-editor-css-v14 */ 마커를
  v9 마커와 따로 검사해서, 이미 v9 마커가 박힌 이펍에도 .nw-*가 들어감(zip.file을 각 블록에서 따로 호출).
- 대시(-) 줄 후보(parseEpub (A2)): 대괄호가 아니라 '- 이렇게' 대시로 시작하는 한 줄 문단도 후보로 잡아서 대괄호 줄과
  똑같이 스타일을 고를 수 있음. 대시 뒤에 글자가 있어야 하고 200자 이하, ---/-*- 같은 구분선은 제외, 이미 후보면 제외.
  '이름: 내용' 모양이면 이름 칸에 이름이 들어감. 스타일을 안 바꾸면(none) 원본 그대로.

[v15 수정 내용]
- 깔끔한 네모창(box)/커뮤·에타 게시물(community): v14가 quote에만 적용했던 "테두리 항상 검정(#222)"을
  이 둘에도 적용(요청: 흰색/라벤더 배경일 때 테두리가 거의 안 보임). buildCandHtml의 box/community
  분기에서 border-color를 팔레트 색(s.border) 대신 #222로 고정. (quote는 v14에서 이미 처리돼 있었음 - 되돌리지 말 것)
- 색상 스와치 자체의 테두리도 같은 문제였음: colorSwatchesHtml의 swatchStyle이 '#ffffff'일 때만 옅은
  회색(#ccc) 테두리를 보여줬는데, STATUS_COLORS 첫 칸(#fafbff, 라벤더빛 거의 흰색 - box/community/quote
  등에서 씀)은 해당이 안 돼서 테두리가 아예 투명이라 패널 배경에 묻혔음. '#fafbff'도 같이 감지하게
  추가하고, 테두리색도 요청대로 검정(#000)으로 바꿈(기존 #ccc보다 진하게).
- '말풍선'(chat) 스타일 완전 삭제(요청). styleOptionsHtml의 옵션, buildCandHtml의 chat 분기,
  sentToggleHtml/colorSwatchesHtml의 chat 체크, 이름 입력칸 노출 목록, 정렬 노출 조건에서 전부 제거.
  예전에 만든 .msg-bubble(말풍선) 문단을 다시 열면(parseEpub (C)) 이제 선택지에 없는 'chat'이 아니라
  'kakao'로 인식되게 바꿈(v5가 chat_avatar를 삭제하면서 kakao로 흡수했던 것과 같은 방식 - 되돌리지 말 것).
  CSS(.msg-bubble 등)는 혹시 몰라 그대로 남겨둠(해 없음).
- 새 스타일 '기울임(검정/회색)'(italic): 대시(-)로 시작하는 줄처럼 괄호 없는 문장을 검정 또는 회색
  기울임 글씨로만 바꾸는 가벼운 스타일(요청). 대괄호를 붙이지 않는다는 점이 '색상 강조'(color, 대괄호
  유지)와 다름. ITALIC_COLORS=['#222222','#888888'] 2색 팔레트(colorSwatchesHtml에 분기 추가),
  buildCandHtml은 <span style="font-style:italic;color:...">만 반환(인라인은 그대로, 블록은 <p>로 감쌈).
- 영상통화(video) 스타일은 이미 v14에서 전화(call)와 동일하게 사람 아이콘(ICON_PERSON)을 쓰고 있었음 -
  "사람모양처럼 나오게" 요청 확인 결과 이미 반영돼 있어 추가 수정 없음(실제 렌더링 Playwright로 재확인).

[v16 수정 내용]
- 스타일 선택 드롭다운이 카톡/연락처/쪽지/전화/영상통화/라이브/커뮤/상태창/네모창/인용박스/뉴스까지
  전부 한 줄짜리 평면 목록이라 위아래 순서가 헷갈린다는 요청 - styleOptionsHtml(inline/block 둘 다)을
  <optgroup>으로 두 묶음으로 나눔: "메신저/알림창"(카톡/연락처 알림창/쪽지/전화 수신/영상통화 수신/
  라이브 방송)과 "게시물/박스"(커뮤·에타/상태창/깔끔한 네모창/인용박스/뉴스 기사형). 그대로/색상강조/
  기울임은 묶음 밖 맨 위에 그대로 둠. 각 묶음 안의 순서(카톡→연락처→쪽지→전화→영상통화→라이브,
  커뮤→상태창→네모창→인용박스→뉴스)는 그대로 유지 - value는 안 바뀌었으니 기존 스타일이 지정된
  후보는 그대로 유지됨(선택 로직은 건드리지 않음, 보이는 목록 구조만 바뀜).

[v17 수정 내용]
- v16의 <optgroup> 방식이 오히려 더 헷갈린다고 해서 되돌림(요청) - 다시 평면 목록으로. 대신
  (1) 거의 모든 옵션 앞에 구분되는 이모지를 붙이고, (2) "쪽지/메시지 알림창"과 "커뮤/에타 게시물"
  사이에 클릭 안 되는 구분선 option(────)을 하나 넣어서 "메신저/알림창류"와 "게시물/박스류"가
  시각적으로만 나뉘어 보이게 함. 순서도 사용자가 정확히 지정한 순서로 바꿈: 기울임 → 카톡 →
  연락처 알림창 → 전화 수신 알림창 → 영상통화 수신 알림창 → 쪽지/메시지 알림창 → (구분선) →
  커뮤/에타 게시물 → 깔끔한 네모창(그림자) → 깔끔한 둥근창(그림자, 예전 "인용박스(그림자)"에서
  이름만 변경 - value는 그대로 'quote') → 뉴스 기사형 → 라이브 방송(LIVE 배지) → 라이브 라디오(신규) →
  상태창. (앞으로 이 순서를 사용자 동의 없이 임의로 다시 바꾸지 말 것.)
- 새 스타일 '라이브 라디오'(radio): live와 완전히 같은 카드 구조, 배지 문구만 'ON AIR'(파란색
  .lv-badge.rd)로 구분. 이름 입력칸 있음(live와 동일), 색 커스텀 없음.
- 영상통화(video) 디자인 전면 교체: 기존엔 call(전화 수신 알림창)과 완전히 같은 "수신 알림 카드"
  였는데, 사용자가 "저건 수신 알림창이고, 연결된 상태의 모습(폰 모양에 네모 테두리, 영통하는
  느낌)을 원한 것"이라고 재설명함(ICON_PERSON이 "사람 모양"이라 맞다고 착각했던 게 오해 - 카드
  종류 자체가 다른 걸 원했던 것). 수신 알림(cl-card, 수락/거절 버튼) 대신 "연결된 영상통화 화면"
  모양의 새 카드(.vc-card)로 교체: 어두운 둥근 네모 테두리 화면 안에 이름(선택)+'영상통화 중' 표시,
  가운데 본문(자막처럼), 아래에 마이크/종료(빨강)/카메라 아이콘 컨트롤 바(ICON_MIC 신규 추가).
  live처럼 색 커스텀 없이 항상 어두운 화면 고정이라 색상 스와치도 숨김(colorSwatchesHtml 노출
  조건에 video 추가).
- 새 CSS는 CARD_CSS_V17 상수 하나(.vc-*, .lv-badge.rd)로 편집창 + 내보내기 둘 다에서 씀. 내보내기는
  /* utsho-editor-css-v17 */ 마커를 v9/v14 마커와 따로 검사해서, 이미 그 마커들이 박힌 이펍에도
  새 CSS가 들어감.

[v18 수정 내용] (★보호 구간 - v17 오해 교정, 앞으로 되돌리지 말 것★)
- v17에서 "영상통화(video)"를 통째로 "연결된 화면"(.vc-card)으로 바꿔버린 게 오해였음이 확인됨.
  사용자 correction: "기존있던것도 두고 연결된 상태에서... 색도 정할수 있게" → (1) 기존 수신 알림
  카드(video)는 원래 v14 모습(.cl-card, call과 동일한 수신/거절 UI, STATUS_COLORS 색 커스텀 있음,
  ICON_PERSON은 그냥 아바타 아이콘)으로 그대로 되돌림. (2) "연결된 화면"은 완전히 별도의 새 스타일
  'vcall'로 분리 추가 - video를 대체하지 않고 둘 다 공존.
- vcall("영상통화 연결 화면"): v17의 .vc-card는 가로로 넓은 모양이라 "폰이니깐 세로로 보여야지"라는
  피드백을 받음 → 세로로 긴(width 9.5em) 폰 모양 카드(.vc2-card, 둥근 모서리 + 두꺼운 테두리)로
  새로 설계. 화면 안 "빈 공간"엔 사람 모양 프로필 아이콘(ICON_PERSON, 원형 배경 .vc2-avatar)을
  넣어 "영상이 비어있는 통화 중" 느낌을 표현. STATUS_COLORS 팔레트로 배경/테두리 색 커스텀 가능
  (live/radio와 달리 색 스와치 노출 - 사용자가 명시적으로 "색도 정할수 있게" 요청함). 아래 컨트롤
  바(마이크/종료 빨강/카메라, ICON_MIC 재사용)는 v17 디자인에서 그대로 가져옴.
  구분: .vc-card(v17, video 되돌리면서 고아 처리된 죽은 CSS - 아무도 안 씀, 혼동 방지 위해 삭제
  안 하고 보존) vs .vc2-card(v18, vcall 전용 - 실제 쓰이는 클래스). 이름 헷갈리지 말 것.
- 드롭다운 순서: video(📹 영상통화 수신 알림창) 바로 다음에 vcall(📱 영상통화 연결 화면) 추가,
  나머지 순서는 v17에서 확정된 순서 그대로 유지.
- CSS는 새 CARD_CSS_V18 상수(.vc2-*)로 분리, 편집창 + 내보내기(/* utsho-editor-css-v18 */ 마커,
  v9/v14/v17 마커와 독립적으로 검사) 둘 다 적용.
- 이름 입력칸 노출 목록(['kakao','letter','call','video','vcall','news','live','radio'])에 vcall
  추가. 색상 스와치 노출 조건(cand.style!=='none'&&cand.style!=='live'&&cand.style!=='radio')에서
  video는 제외 목록에서 빠짐(색 커스텀 복원), vcall은 원래부터 제외 안 됨.

[v19 수정 내용]
- 저장 파일명: 소설 제목/올린 파일명을 찾은 경우에도 끝에 '수정됨'을 붙이도록 바꿈
  (예: '신내림 받고 이혼함.epub' -> '신내림 받고 이혼함 수정됨.epub'). 둘 다 못 찾아 기본값
  '수정됨'으로 떨어지는 경우엔 중복으로 안 붙게(그대로 '수정됨.epub').
- 연락처 알림창(.msg-contact, v7에서 추가된 스타일) 오른쪽 삐져나옴 버그 수정: 사용자가 실제
  이펍 스샷으로 제보("저기 짤려") - 박스가 핸드폰 화면 오른쪽 끝으로 넘쳐서 잘려 보임. 원인은
  v4 시절 만들어진 옛 CSS가 display:table;width:100%에 padding까지 얹은 것(box-sizing 지정이
  없어 패딩만큼 전체 폭이 100%를 넘어서 삐져나감) - v9에서 letter/call(.nf-*/.cl-*)은 이미
  "바깥 박스(block+padding) + 안쪽 표(table+width100%, padding 없음)" 구조로 고쳐졌지만, contact는
  그 리팩터링에서 빠져 있었음(바깥 div 하나에 table+width100%+padding을 그대로 다 몰아 씀).
  편집창 <style>의 .msg-contact는 display:block+box-sizing:border-box로 직접 고침. 내보내기는
  v9 템플릿 속 옛 .msg-contact 규칙은 그대로 두고(히스토리 보존), /* utsho-editor-css-v19 */
  마커 블록에서 고쳐진 .msg-contact 규칙을 CSS 파일 맨 뒤에 다시 선언해 캐스케이드로 덮어씀
  - 이렇게 하면 이미 v9 마커가 박힌 예전 이펍을 다시 열어 내보내도, 새로 올리는 이펍도 전부
  이 블록 하나로 고쳐짐(되돌리지 말 것 - .msg-contact 원본 선언을 직접 지우면 과거 버전과의
  diff가 커지므로 override 방식 유지).

[v20 수정 내용]
- parseEpub()에 "「이렇게 겹낫표로 감싼 대사」" 문단 전체를 후보로 잡는 (A3) 단계 추가. 기존
  [대괄호]/-대시 후보와 동일한 방식(type:'block', 전체 문단이 「로 시작 」로 끝나야 함, 200자
  이하, 이미 다른 후보로 잡힌 문단은 제외)으로 동작하고, 스타일 드롭다운에서 똑같이 카톡/상태창/
  네모창 등 아무 스타일이나 고를 수 있음. style을 'none'(그대로)으로 두면 원본 「 」 모양 그대로
  남고(exportEpub의 "style==='none'이면 원본 안 건드림" 로직 그대로 적용됨 - 재작성 불필요),
  스타일을 고르면 body에는 겹낫표를 뺀 안쪽 텍스트만 들어감. dash 후보처럼 메타데이터로
  corner:true만 붙여둠(동작에 필수는 아니고 구분용).
- 참고: 「 」는 일본식 겹낫표로, 원래 소설 속 대사 표시 용도라 대괄호/대시와는 별개 패턴이었음 -
  사용자가 "이것도 수정툴에서 후보로 안 잡힌다"고 물어서 추가한 것. 대사를 알림창 스타일로
  바꾸고 싶을 때만 쓰는 기능이고, 그대로 둘 땐 평범한 대사로 읽힘.

[v21 수정 내용]
- 새 스타일 "카톡 사진(JPG 아이콘)"(kakao_photo) 추가: 사용자가 커뮤 게시물 캡처(회색 문서
  모양 안에 산/해 그림 + "JPG" 글자인 범용 "이미지 파일" 아이콘, 그 아래 흐릿한 설명 캡션)를
  보여주며 "이거 카톡에도 부여 가능?"이라고 물음. 실제 사진을 업로드/삽입하는 게 아니라(그건
  이미지 업로드 기능이 따로 필요해서 전에도 "가능은 한데 범위 밖"이라고만 답했었음) 그 캡처처럼
  고정된 회색 "사진 파일" 아이콘 placeholder를 카톡 말풍선 자리에 넣는 것이라, 업로드 기능
  없이도 바로 구현 가능해서 추가함. 카톡(kakao)과 동일하게: 받은/보낸(sent) 좌우 정렬, 배경
  박스(.kt-box) on/off, 이름표 전부 동일 로직 재사용(sentToggleHtml/boxToggleHtml/이름 입력칸
  노출 목록에 kakao_photo 추가). 대괄호 안 본문은 사진 캡션으로 씀(비어 있으면 캡션 생략).
  색상 커스텀은 없음(아이콘이 고정색이라 의미 없음 - colorSwatchesHtml 노출 조건에서 제외).
  새 ICON_JPG(문서+이미지+JPG 글자, 다른 ICON_*와 달리 흰색 단색이 아니라 자체 배색을 가진
  아이콘이라 어두운 원 배경 없이 단독 사용) + CARD_CSS_V21(.kt-photo/.kt-photo-icon/.kt-photo-cap)
  로 구현, 내보내기는 /* utsho-editor-css-v21 */ 마커로 별도 주입(이전 마커들과 독립).
  스타일 드롭다운에서 카톡 바로 아래(연락처 알림창 위)에 배치.

[v22 수정 내용]
- "카톡 사진"(kakao_photo)이 아이콘+캡션만 배경 없이 둥 떠 있어서, 일반 카톡 말풍선(.kt-bubble)
  처럼 색 배경이 있어야 한다는 지적을 받음(실제 폰 캡처에서도 사진 말풍선은 색 배경이 있음).
  CHAT_COLORS 배경 + 방향별(받은=왼쪽 위 모서리 각짐/보낸=오른쪽 위 모서리 각짐) 둥근 모서리를
  .kt-bubble과 동일한 방식으로 추가 - 배경색은 buildCandHtml에서 인라인 style로, 말풍선 모양
  (패딩/모서리)은 새 CARD_CSS_V22(.kt-photo padding+border-radius)로 분리. 색상 스와치도 kakao와
  동일하게 다시 노출(colorSwatchesHtml의 isChat 조건에 kakao_photo 추가, 스와치 숨김 목록에서도
  kakao_photo 제거). /* utsho-editor-css-v22 */ 마커로 내보내기 별도 주입(v21까지 마커 있는
  이펍에도 들어감).

[v23 수정 내용] (★보호 구간 - 실제 발견된 심각한 버그 수정, 되돌리지 말 것★)
- 사용자가 1권+2권을 합권기로 합친 이펍을 수정툴로 처리했더니, 2권 쪽 뉴스 카드만 배지/굵게
  없이 밋밋하게 나온다고 제보함. 처음엔 "합권기가 2권 스타일시트를 빠뜨렸나" 생각해서 합권기
  쪽을 고쳤었는데, 사용자가 "수정툴을 말한 건데 왜 합권기냐"고 재지적해서 다시 확인함 -
  실제 원인은 수정툴(exportEpub) 자신에게 있었음: 합권기로 합친 이펍은 style.css가 b1/style.css,
  b2/style.css처럼 권마다 따로 있는데, 옛 코드가
  `Object.keys(zip.files).find(p=>/style\.css$/i.test(p))`로 "맨 처음 찾은 style.css 딱 1개"만
  찾아서 거기에만 CARD_CSS_V9~V22를 전부 넣고 있었음. 반면 parseEpub/exportEpub는 챕터를
  "chap숫자.xhtml" 파일명 패턴으로만 걸러서 b1/든 b2/든 폴더 구분 없이 전부 처리하므로, 2권
  챕터도 똑같이 .nw-card 같은 HTML은 입혀지는데 그 CSS는 1권 style.css에만 들어가고 2권
  style.css에는 전혀 안 들어갔던 것. find(1개만 찾음)를 filter(전부 찾음)로 바꾸고, CSS
  주입 블록 전체를 `for(const cssPath of cssPaths)` 루프로 감싸서 찾아낸 style.css 전부에
  똑같이 CSS가 들어가게 고침. (합권기 쪽 v6.9에서 추가한 "권별 CSS 마커 보강" 기능은 그 자체로도
  무해한 보강책이라 되돌리지 않고 남겨둠 - 다만 이번 버그의 진짜 원인은 이쪽(수정툴)이었음.)
-->

let bookTitle='', uploadedName='';

let candidateSeq=0;
let activeChapterIdx=0;

document.getElementById('epubInput').addEventListener('change', handleUpload);

async function handleUpload(e){
  const file=e.target.files[0];
  if(!file) return;
  uploadedName=file.name.replace(/\.epub$/i,'');
  document.getElementById('uploadStatus').textContent='읽는 중...';
  try{
    zip=await JSZip.loadAsync(file);
    await parseEpub();
    document.getElementById('uploadStatus').textContent=`${chapters.length}개 챕터 불러옴, 대괄호 후보 ${chapters.reduce((s,c)=>s+c.candidates.length,0)}개 찾음`;
    document.getElementById('mainArea').style.display='block';
    renderChapterTabs();
    renderChapterPanel(0);
  }catch(err){
    document.getElementById('uploadStatus').textContent='오류: '+err.message;
    console.error(err);
  }
}

async function parseEpub(){
  chapters=[];
  candidateSeq=0;
  // container.xml에서 opf 경로 찾기
  const containerXml=await zip.file('META-INF/container.xml').async('string');
  const opfMatch=containerXml.match(/full-path="([^"]+)"/);
  opfPath=opfMatch[1];
  oebpsDir=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
  const opfXml=await zip.file(opfPath).async('string');
  const opfDoc=new DOMParser().parseFromString(opfXml,'application/xml');
  const _dcT=opfDoc.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/','title')[0]; // v9: 저장 파일 이름용 소설 제목
  bookTitle=_dcT?_dcT.textContent.trim():'';
  // manifest: id -> href
  const manifest={};
  opfDoc.querySelectorAll('manifest item').forEach(item=>{
    manifest[item.getAttribute('id')]=item.getAttribute('href');
  });
  // spine 순서대로 챕터 파일만(챕터 파일명이 chap로 시작하는 것 위주, cover/toc 등은 제외)
  const spineRefs=Array.from(opfDoc.querySelectorAll('spine itemref')).map(x=>x.getAttribute('idref'));
  for(const idref of spineRefs){
    const href=manifest[idref];
    if(!href) continue;
    if(!/chap\d+\.xhtml$/i.test(href)) continue; // 표지/목차 페이지 등은 편집 대상에서 제외
    const fullPath=oebpsDir+href;
    const fileObj=zip.file(fullPath);
    if(!fileObj) continue;
    const xhtml=await fileObj.async('string');
    const doc=new DOMParser().parseFromString(xhtml,'application/xhtml+xml');
    const titleEl=doc.querySelector('h2,h3,title');
    const label=(titleEl?titleEl.textContent.trim():href).slice(0,20)||href;
    const candidates=[];
    const groups={};
    doc.querySelectorAll('body p').forEach(p=>{
      const txt=(p.textContent||'').trim();
      // (A) 문단 전체가 대괄호인 "한 줄짜리 메시지" 후보.
      // 대괄호 덩어리가 여러 개 한 줄에 붙어있으면(예: "[A][B][C]") 원문이 그렇게
      // 되어있는 것 — 메시지 여러 개가 줄바꿈 없이 이어붙은 것이므로, 하나로
      // 뭉개지 않고 덩어리별로 쪼개서 각각 따로 후보로 만듦.
      if(/^\[.{1,198}$/.test(txt)&&txt.includes(']')){
        const groups_found=[...txt.matchAll(/\[([^\[\]]{1,180})\]/g)];
        if(groups_found.length>1){
          const groupId='grp'+(candidateSeq);
          p.setAttribute('data-utsho-group',groupId);
          groups[groupId]=p;
          groups_found.forEach((gm,gi)=>{
            const id='cand'+(candidateSeq++);
            const inner=gm[1].trim();
            const nameMatch=inner.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
            candidates.push({
              type:'block', id, path:fullPath, origText:'['+inner+']',
              body: nameMatch?nameMatch[2].trim():inner,
              name: nameMatch?nameMatch[1].trim():'',
              style:'none', colorIdx:0, groupId, groupOrder:gi
            });
          });
          return;
        }
        const id='cand'+(candidateSeq++);
        p.setAttribute('data-utsho-id',id);
        const inner=txt.replace(/^\[/,'').replace(/\]/,'').trim();
        const nameMatch=inner.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
        candidates.push({
          type:'block', id, path:fullPath, origText:txt,
          body: nameMatch?nameMatch[2].trim():inner,
          name: nameMatch?nameMatch[1].trim():'',
          style:'none', colorIdx:0
        });
        return; // 문단 전체가 이미 후보면 그 안의 인라인 대괄호는 따로 안 잡음
      }
      // (A2) v14: "- 이렇게 대시(-)로 시작하는 한 줄" 문단도 후보로 잡음(대괄호와 똑같이 스타일을 고를 수 있음).
      // 대시 뒤에 글자가 있어야 하고(---, -*- 같은 구분선 제외), 200자 이하인 문단만. 이미 다른 후보면 제외.
      // 읏쇼가 기울임(soft-quote)으로 감싼 줄도 textContent로 읽으므로 같이 잡힘. 스타일을 안 바꾸면(none) 원본 그대로 둠.
      const dashM=txt.match(/^[-–—]\s*(\S[\s\S]{0,198})$/);
      if(dashM&&!/^[-–—\s~=*·.]+$/.test(txt)&&!p.getAttribute('data-utsho-id')){
        const id='cand'+(candidateSeq++);
        p.setAttribute('data-utsho-id',id);
        const inner=dashM[1].trim();
        const nameMatch=inner.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
        candidates.push({type:'block', id, path:fullPath, origText:txt, dash:true,
          body: nameMatch?nameMatch[2].trim():inner, name: nameMatch?nameMatch[1].trim():'',
          style:'none', colorIdx:0});
        return;
      }
      // (A3) v20: "「이렇게 겹낫표로 감싼 대사」" 문단 전체도 후보로 잡음(대괄호/대시와 동일하게 스타일
      // 선택 가능). 전체 문단이 「로 시작해 」로 끝나야 하고 200자 이하. 이미 다른 후보면 제외.
      // style이 'none'이면 위 dash/bracket과 마찬가지로 원본 그대로 둠(교체 안 함).
      const cornerM=txt.match(/^「([\s\S]{1,198})」$/);
      if(cornerM&&!p.getAttribute('data-utsho-id')){
        const id='cand'+(candidateSeq++);
        p.setAttribute('data-utsho-id',id);
        const inner=cornerM[1].trim();
        const nameMatch=inner.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
        candidates.push({type:'block', id, path:fullPath, origText:txt, corner:true,
          body: nameMatch?nameMatch[2].trim():inner, name: nameMatch?nameMatch[1].trim():'',
          style:'none', colorIdx:0});
        return;
      }
      // (B) 문장 중간에 낀 인라인 대괄호(예: "~을 검색했다" 문장 속 [단어])도 후보로.
      // 읏쇼가 기울임 처리했으면 <span class="soft-quote">[...]</span> 형태로,
      // 안 했으면 그냥 텍스트 그대로 [...] 로 들어있어서 둘 다 잡아줌.
      let html=p.innerHTML;
      let changed=false;
      html=html.replace(/<span class="soft-quote">\[([^<]{1,180})\]<\/span>|(?<!<span class="utsho-inline"[^>]*>)\[([^\[\]<]{1,180})\]/g,(m,g1,g2)=>{
        const inner=(g1!==undefined?g1:g2).trim();
        if(!inner) return m;
        const id='cand'+(candidateSeq++);
        changed=true;
        candidates.push({type:'inline', id, path:fullPath, origMatch:m, body:inner, name:'', style:'none', colorIdx:0});
        return `<span class="utsho-inline" data-utsho-id="${id}">${m}</span>`;
      });
      if(changed) p.innerHTML=html;
    });
    // (C) 이미 말풍선/상태창으로 변환된 요소 안에 대괄호[...]가 여러 덩어리
    // 그대로 남아있는 경우 (예: 읏쇼가 "이름: 내용"으로 첫 메시지만 뽑고 나머지
    // 뒤에 붙은 [이름: 내용] 들은 괄호째로 텍스트에 남겨버린 경우) — 각각을
    // 별도 말풍선으로 다시 쪼갬. 하나만 남아있으면 그냥 "괄호 제거"로 처리.
    doc.querySelectorAll('.msg-bubble, .msg-avatar-row, .msg-status, .msg-status-danger').forEach(outerEl=>{
      // 실제 텍스트가 들어있는 안쪽 요소(아바타형은 span, 나머진 자기 자신)
      const textEl=outerEl.classList.contains('msg-avatar-row')?outerEl.querySelector('.msg-avatar-bubble span'):outerEl;
      if(!textEl) return;
      const t=(textEl.textContent||'').trim();
      if(!t.includes('[')&&!t.includes(']')) return;
      const bracketGroups=[...t.matchAll(/\[([^\[\]]{1,180})\]/g)];
      const leadSeg=t.split('[')[0].trim();
      const totalMsgs=(leadSeg?1:0)+bracketGroups.length;
      if(totalMsgs>1){
        const groupId='grp'+(candidateSeq);
        outerEl.setAttribute('data-utsho-group',groupId);
        groups[groupId]=outerEl;
        let order=0;
        if(leadSeg){
          const id='cand'+(candidateSeq++);
          const nameMatch=leadSeg.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
          candidates.push({type:'block', id, path:fullPath, origText:leadSeg,
            body:nameMatch?nameMatch[2].trim():leadSeg, name:nameMatch?nameMatch[1].trim():'',
            style:'kakao', colorIdx:0, groupId, groupOrder:order++}); // v15: '말풍선'(chat) 스타일 삭제로 기본값을 kakao로
        }
        bracketGroups.forEach(gm=>{
          const id='cand'+(candidateSeq++);
          const inner=gm[1].trim();
          const nameMatch=inner.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
          candidates.push({type:'block', id, path:fullPath, origText:'['+inner+']',
            body:nameMatch?nameMatch[2].trim():inner, name:nameMatch?nameMatch[1].trim():'',
            style:'kakao', colorIdx:0, groupId, groupOrder:order++}); // v15: '말풍선'(chat) 스타일 삭제로 기본값을 kakao로
        });
        return;
      }
      // 대괄호가 하나도 없으면(이미 깔끔하게 변환 완료된 상태) —
      // 다른 스타일로 바꿀 수 있게 일반 재수정 후보로 등록.
      // 대괄호가 딱 하나만 덜 지워진 채 남았으면 괄호 제거 후 재수정 후보로.
      // v15: '말풍선'(chat) 스타일 삭제 - 예전에 만든 .msg-bubble(말풍선) 문단을 다시 열면
      // 이제 선택지에 없는 'chat'이 아니라 'kakao'로 인식되게 함(v5가 chat_avatar를 kakao로
      // 흡수했던 것과 같은 방식).
      const detectedStyle=outerEl.classList.contains('msg-avatar-row')?'kakao'
        :outerEl.classList.contains('msg-status-danger')?'status'
        :outerEl.classList.contains('msg-status')?'status'
        :'kakao';
      const cleanBody=t.replace(/[\[\]]/g,'').trim();
      const nameMatch=cleanBody.match(/^([가-힣a-zA-Z0-9 ]{1,12}):\s*(.+)$/s);
      const id='cand'+(candidateSeq++);
      outerEl.setAttribute('data-utsho-id',id);
      candidates.push({type:'block', id, path:fullPath, origText:t,
        body:nameMatch?nameMatch[2].trim():cleanBody, name:nameMatch?nameMatch[1].trim():'',
        style:detectedStyle, colorIdx:0, replaceOuter:true});
    });
    // (D) 전환마크처럼 보이는 기호 줄(◆◆◆, ***, --- 등)인데 가운데 정렬이
    // 안 되어 있는 문단 — "가운데 정렬" 원클릭 후보로 잡음.
    doc.querySelectorAll('body p').forEach(p=>{
      if(p.getAttribute('data-utsho-id')) return; // 이미 다른 후보로 잡힌 문단은 제외
      const t=(p.textContent||'').trim();
      const looksLikeMark=/^[◆◇■□▶▷★☆●○♦♠♣♥§※▪▫▬▲△▼▽►◄*＊\-~=·・.]{2,20}$/.test(t)&&t.length<=20;
      const alreadyCentered=/text-align\s*:\s*center/i.test(p.getAttribute('style')||'')||p.className.includes('scene-break');
      if(looksLikeMark&&!alreadyCentered){
        const id='cand'+(candidateSeq++);
        p.setAttribute('data-utsho-id',id);
        candidates.push({type:'cleanup_align', id, path:fullPath, origText:t, style:'none'});
      }
    });
    chapters.push({path:fullPath, href, label, doc, candidates, groups});
  }
}

function renderChapterTabs(){
  const box=document.getElementById('chapterTabs');
  box.innerHTML='';
  chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='chapter-tab'+(i===activeChapterIdx?' active':'');
    b.textContent=`${c.label} (${c.candidates.length})`;
    b.onclick=()=>{activeChapterIdx=i;renderChapterTabs();renderChapterPanel(i);};
    box.appendChild(b);
  });
}

  </select>`;
}
function setCandAlign(id,val){ const c=findCand(id); c.align=val; renderPreview(c); }

function sentToggleHtml(cand){
  // v21: 카톡 사진(kakao_photo)도 카톡과 동일하게 좌/우(받은/보낸) 토글 필요
  if(cand.style!=='kakao'&&cand.style!=='kakao_photo') return ''; // v15: '말풍선'(chat) 삭제로 kakao만 체크
  return `<label style="cursor:pointer;"><input type="checkbox" ${cand.sent?'checked':''} onchange="setCandSent('${cand.id}',this.checked)"> 내가 보낸 말(오른쪽)</label>`;
}
function setCandSent(id,val){ const c=findCand(id); c.sent=val; renderPreview(c); }

// v12: "내가 보낸 말" 체크박스 옆에 카톡의 흰 배경+테두리 박스(.kt-box)를 껏다 켰다 하는 체크박스.
// 꺼면 말풍선이 박스 없이 예전(v7까지)처럼 바로 떠 있는 형태로 나옴.
function boxToggleHtml(cand){
  if(cand.style!=='kakao'&&cand.style!=='kakao_photo') return ''; // v21: 카톡 사진도 동일
  return `<label style="cursor:pointer;"><input type="checkbox" ${cand.showBox!==false?'checked':''} onchange="setCandShowBox('${cand.id}',this.checked)"> 배경 박스</label>`;
}
function setCandShowBox(id,val){ const c=findCand(id); c.showBox=val; renderPreview(c); }

function colorSwatchesHtml(cand){
  // v7: 흰색(#ffffff) 스와치는 선택 안 된 상태일 때 테두리가 투명이면 패널 배경과 구분이 안 가서,
  // 흰색이고 선택되지 않았을 때만 테두리를 보이게 함(선택됐을 땐 기존 .sel 진한 테두리 유지).
  // v15: STATUS_COLORS 첫 칸(#fafbff, 라벤더빛 거의 흰색)도 같은 문제라 추가. 테두리색도
  // 옅은 회색(#ccc)이라 여전히 잘 안 보인다는 지적이 있어 검정(#000)으로 바꿈.
  const swatchStyle=(c,sel)=>`background:${c};${((c==='#ffffff'||c==='#fafbff')&&!sel)?'border-color:#000;':''}`;
  if(cand.style==='color'){
    return CHAT_COLORS.map((c,i)=>{const sel=cand.colorIdx===i;return `<span class="swatch${sel?' sel':''}" style="${swatchStyle(c,sel)}" onclick="setCandColor('${cand.id}',${i})"></span>`;}).join('');
  }
  if(cand.style==='italic'){
    return ITALIC_COLORS.map((c,i)=>{const sel=cand.colorIdx===i;return `<span class="swatch${sel?' sel':''}" style="${swatchStyle(c,sel)}" onclick="setCandColor('${cand.id}',${i})"></span>`;}).join('');
  }
  const isChat=cand.style==='kakao'||cand.style==='kakao_photo'; // v22: 카톡 사진도 카톡 말풍선처럼 배경색 커스텀 가능
  const palette=isChat?CHAT_COLORS:STATUS_COLORS.map(s=>s.bg);
  return palette.map((c,i)=>{const sel=cand.colorIdx===i;return `<span class="swatch${sel?' sel':''}" style="${swatchStyle(c,sel)}" onclick="setCandColor('${cand.id}',${i})"></span>`;}).join('');
}

function renderChapterPanel(idx){
  const chap=chapters[idx];
  const panel=document.getElementById('chapterPanel');
  if(!chap.candidates.length){
    panel.innerHTML=`<div class="status-msg">이 챕터에는 대괄호[] 나 대시(-) 로 시작하는 줄이 없어요.</div>`;
    return;
  }
  panel.innerHTML=chap.candidates.map(cand=>{
    if(cand.type==='cleanup_bracket'){
      return `<div class="candidate" id="row-${cand.id}">
        <div class="orig">${escHtml(cand.origText)}</div>
        <div class="ctrl-row">
          <label>남은 괄호 기호가 있어요</label>
          <button class="btn" onclick="applyCleanup('${cand.id}')" ${cand.style==='done'?'disabled':''}>${cand.style==='done'?'✓ 제거됨':'[ ] 괄호 제거'}</button>
        </div>
      </div>`;
    }
    if(cand.type==='cleanup_align'){
      return `<div class="candidate" id="row-${cand.id}">
        <div class="orig">${escHtml(cand.origText)}</div>
        <div class="ctrl-row">
          <label>전환마크로 보이는데 가운데 정렬이 아니에요</label>
          <button class="btn" onclick="applyCleanup('${cand.id}')" ${cand.style==='done'?'disabled':''}>${cand.style==='done'?'✓ 가운데 정렬됨':'↔ 가운데 정렬'}</button>
        </div>
      </div>`;
    }
    return `
    <div class="candidate" id="row-${cand.id}">
      <div class="orig">${cand.type==='inline'?'문장 속: ':''}${escHtml(cand.type==='inline'?('['+cand.body+']'):cand.origText)}</div>
      <div class="ctrl-row">
        <label>스타일</label>
        <select onchange="setCandStyle('${cand.id}',this.value)">${styleOptionsHtml(cand)}</select>
        ${['kakao','kakao_photo','letter','call','video','vcall','news','live','radio'].includes(cand.style)?`<label>이름</label><input type="text" value="${escHtml(cand.name)}" placeholder="이름(선택)" style="width:90px;" oninput="setCandName('${cand.id}',this.value)">`:''}${sentToggleHtml(cand)}${boxToggleHtml(cand)}
      </div>
      ${(cand.style!=='none'&&cand.style!=='live'&&cand.style!=='radio')?`<div class="ctrl-row">${colorSwatchesHtml(cand)}</div>`:''}
      ${(cand.style!=='none'&&cand.style!=='kakao'&&cand.style!=='kakao_photo')?`<div class="ctrl-row">${alignSelectHtml(cand)}</div>`:''}
      <div class="preview-box" id="prev-${cand.id}"></div>
    </div>
  `;
  }).join('');
  chap.candidates.filter(c=>c.type!=='cleanup_bracket'&&c.type!=='cleanup_align').forEach(c=>renderPreview(c));
}

function applyCleanup(id){
  const c=findCand(id);
  c.style='done';
  renderChapterPanel(activeChapterIdx);
}

function findCand(id){
  for(const c of chapters) for(const cd of c.candidates) if(cd.id===id) return cd;
}
function setCandStyle(id,val){ const c=findCand(id); c.style=val; c.colorIdx=0; renderChapterPanel(activeChapterIdx); }
function setCandColor(id,i){ const c=findCand(id); c.colorIdx=i; renderChapterPanel(activeChapterIdx); }
function setCandName(id,val){ const c=findCand(id); c.name=val; renderPreview(c); }

function buildCandHtml(cand){
  // v13: "이름 표시" 체크박스는 삭제 요청으로 완전히 뺌 - 이름 입력칸만 남고, 이름을 적어두면
  // (toggle 없이) 항상 보임. 이전 v9~v12의 showName 로직은 제거.
  const nameTxt=cand.name||'';
  const name=nameTxt?`<span class="msg-name">${escHtml(nameTxt)}</span>`:'';
  if(cand.style==='color'){
    const c=CHAT_COLORS[cand.colorIdx];
    // v7: 팔레트에서 검정 빼고 흰색을 넣었는데, "색상 강조"는 글자색으로 바로 쓰는 스타일이라
    // 흰색을 고르면 흰 바탕 책 위에서 글자가 안 보이게 됨 - 이때만 보이는 회색으로 대체
    return `<span style="color:${c==='#ffffff'?'#999':c};font-weight:700;">[${escHtml(cand.body)}]</span>`;
  }
  if(cand.style==='italic'){
    // v15: 대시(-)로 시작하는 줄 등을 검정/회색 기울임 글씨로 바꾸는 스타일(요청). 대괄호를
    // 덧붙이지 않고 본문 그대로 기울임 처리만 함 - '색상 강조'(대괄호 유지)와는 용도가 다름.
    const c=ITALIC_COLORS[cand.colorIdx]||ITALIC_COLORS[0];
    const inner=`<span style="font-style:italic;color:${c};">${escHtml(cand.body)}</span>`;
    return cand.type==='inline'?inner:`<p>${inner}</p>`;
  }
  if(cand.style==='kakao'){
    // v2: 아이콘 없이 말풍선 모양(왼쪽 위/오른쪽 위 모서리)만으로 방향을 표시하는 카톡 스타일.
    // v8: 사용자가 준 참고 스샷처럼, 말풍선 혼자 둥 뜨는 게 아니라 흰 배경+옅은 테두리의
    // 네모 박스(.kt-box, 휴대폰 채팅 캡처 느낌) 안에 말풍선이 들어가게 감쌈.
    // v9: 이름표를 박스 안(말풍선 바로 위)으로 옮김 + 이름 표시 토글 추가.
    // v10: "이름표 자체를 아예 빼라"로 잘못 이해해서 토글을 무시하고 항상 숨겼었음 - 사용자가
    // 다시 정정: 이름 입력칸/토글은 그대로 두고, "이름 표시" 체크를 끈(showName===false) 것만
    // 안 보이게 하라는 뜻이었음. v9의 토글 동작으로 되돌림.
    // v12: 애초에 "내가 보낸 말 옆에 체크할 수 있는 걸 만들고"가 말한 건 이름 토글이 아니라
    // 이 흰 배경+테두리 박스(.kt-box) 자체를 켰다 껐다 하는 체크박스였음(사용자가 재정정).
    // boxToggleHtml/setCandShowBox로 추가한 체크박스(cand.showBox, 기본 켜짐)를 반영 -
    // 꺼져 있으면 박스 없이 말풍선(+이름표)만 바로 뜸(v7까지의 모양).
    const bg=CHAT_COLORS[cand.colorIdx];
    const side=cand.sent?'right':'left';
    const nm=(!cand.sent&&nameTxt)?`<span class="kt-name">${escHtml(nameTxt)}</span>`:'';
    const bubble=`<div class="kt-bubble ${side}" style="background:${bg};">${escHtml(cand.body)}</div>`;
    if(cand.showBox===false) return `${nm}${bubble}`;
    return `<div class="kt-box">${nm}${bubble}</div>`;
  }
  if(cand.style==='kakao_photo'){
    // v21: "카톡 사진" - 실제 이미지를 업로드/삽입하는 게 아니라(그건 별도 업로드 기능이 필요해서
    // 아직 구현 안 함), 사용자가 보여준 커뮤 게시물 예시처럼 "사진 파일임을 나타내는 회색 JPG
    // 아이콘" placeholder를 카톡 말풍선 자리에 넣는 것. 대괄호 안 본문은 사진 설명(캡션)으로 써서
    // 아이콘 아래 작게 표시(비어 있으면 캡션 생략). kakao와 동일하게 받은/보낸(sent) 좌우 정렬,
    // 배경 박스(.kt-box) on/off, 이름표 전부 동일하게 적용.
    // v22: 아이콘만 둥 떠있지 않고 일반 카톡 말풍선처럼 색 배경이 있어야 한다는 지적 - kt-bubble과
    // 동일하게 CHAT_COLORS 배경 + 방향별 둥근 모서리(.kt-photo.left/right)를 적용함(색상 스와치도
    // kakao와 동일하게 다시 노출).
    const bg=CHAT_COLORS[cand.colorIdx];
    const side=cand.sent?'right':'left';
    const nm=(!cand.sent&&nameTxt)?`<span class="kt-name">${escHtml(nameTxt)}</span>`:'';
    const cap=cand.body?`<span class="kt-photo-cap">${escHtml(cand.body)}</span>`:'';
    const photo=`<div class="kt-photo ${side}" style="background:${bg};"><span class="kt-photo-icon">${ICON_JPG}</span>${cap}</div>`;
    if(cand.showBox===false) return `${nm}${photo}`;
    return `<div class="kt-box">${nm}${photo}</div>`;
  }
  const al=cand.align&&cand.align!=='left'?`text-align:${cand.align};`:'';
  if(cand.style==='community'){
    // v15: box/quote와 동일하게 테두리를 팔레트 색 대신 항상 검정(#222)으로(흰색/라벤더 배경일 때
    // 테두리가 거의 안 보인다고 해서 고정).
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="msg-community" style="${al}background:${s.bg};border-color:#222;color:${s.dark?'#eee':'#2a2a2a'};">${nameTxt?`<span class="cm-head" style="color:${s.head};">${escHtml(nameTxt)}</span>`:''}${escHtml(cand.body)}</div>`;
  }
  if(cand.style==='box'){
    // v15: 테두리를 팔레트 색(s.border) 대신 항상 검정(#222)으로 - 라벤더(첫 칸) 배경일 때
    // 테두리가 거의 흰색처럼 옅어서 안 보인다고 해서, v14의 quote와 동일하게 고정함.
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="msg-box" style="${al}background:${s.bg};border-color:#222;color:${s.dark?'#eee':'#2a2a2a'};">${name}${escHtml(cand.body)}</div>`;
  }
  if(cand.style==='quote'){
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="msg-quote" style="${al}background:${s.bg};border-color:#222;color:${s.dark?'#eee':'#2a2a2a'};">${name}${escHtml(cand.body)}</div>`;
  }
  if(cand.style==='status'){
    const s=STATUS_COLORS[cand.colorIdx];
    const cls=s.key==='red'?'msg-status-danger':'msg-status';
    return `<div class="${cls}" style="${al}background:${s.bg};border-color:${s.border};color:${s.dark?'#eee':'#2a2a2a'};"><span class="st-head" style="color:${s.head};">${s.label}</span>${escHtml(cand.body)}<span class="st-rule" style="border-color:${s.border};"></span></div>`;
  }
  if(cand.style==='letter'){
    // v9: 알림 배너 - 앱 아이콘(둥근 네모) + '메시지'/지금 + 보낸 사람 + 내용
    const s=STATUS_COLORS[cand.colorIdx];
    const ib=s.dark?'#666':s.head;
    return `<div class="nf-card" style="${al}background:${s.bg};border-color:${s.border};"><div class="nf-row"><div class="nf-icon"><span class="nf-ico" style="background:${ib};">${ICON_MAIL}</span></div><div class="nf-body"><span class="nf-top"><span class="nf-app" style="color:${s.dark?'#ddd':s.head};">메시지</span><span class="nf-time">지금</span></span>${nameTxt?`<span class="nf-title" style="color:${s.dark?'#eee':'#2a2a2a'};">${escHtml(nameTxt)}</span>`:''}<span class="nf-text" style="color:${s.dark?'#eee':'#2a2a2a'};">${escHtml(cand.body)}</span></div></div></div>`;
  }
  if(cand.style==='call'){
    // v9: 전화 수신 화면 카드 - 사람 아이콘 + 전화 수신 중 + 내용 + 거절/수락 버튼
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="cl-card" style="${al}background:${s.bg};border-color:${s.border};"><div class="cl-row"><div class="cl-ava-cell"><span class="cl-ava">${ICON_PERSON}</span></div><div class="cl-body"><span class="cl-label" style="color:${s.dark?'#ddd':s.head};">${nameTxt?escHtml(nameTxt)+' · ':''}전화 수신 중</span><span class="cl-text" style="color:${s.dark?'#eee':'#2a2a2a'};">${escHtml(cand.body)}</span></div><div class="cl-btns"><span class="cl-btn dec">${ICON_CLOSE}</span><span class="cl-btn acc">${ICON_PHONE}</span></div></div></div>`;
  }
  if(cand.style==='news'){
    // v14: 뉴스 기사형 - 위에 굵은 검정 줄, NEWS 배지 + 매체명(이름) + 방금 전, 아래에 굵은 헤드라인(내용)
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="nw-card" style="${al}background:${s.bg};color:${s.dark?'#eee':'#2a2a2a'};"><span class="nw-top"><span class="nw-tag" style="${s.dark?'background:#eee;color:#222;':''}">NEWS</span>${nameTxt?`<span class="nw-src">${escHtml(nameTxt)}</span>`:''}<span class="nw-time">방금 전</span></span><span class="nw-head">${escHtml(cand.body)}</span></div>`;
  }
  if(cand.style==='video'){
    // v14: 영상통화 수신 알림창 - 전화(call)와 같은 수신 카드, 수락 버튼만 카메라 아이콘.
    // v17에서 "연결된 화면"으로 통째로 바꿨었는데, 사용자가 "기존 수신 알림창도 그대로 두고
    // 연결된 화면은 별도 스타일로 따로 만들어달라"고 해서 v18에서 원래 모습으로 되돌림
    // (되돌리지 말 것 - 연결 화면은 'vcall' 스타일로 따로 있음).
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="cl-card" style="${al}background:${s.bg};border-color:${s.border};"><div class="cl-row"><div class="cl-ava-cell"><span class="cl-ava">${ICON_PERSON}</span></div><div class="cl-body"><span class="cl-label" style="color:${s.dark?'#ddd':s.head};">${nameTxt?escHtml(nameTxt)+' · ':''}영상통화 수신 중</span><span class="cl-text" style="color:${s.dark?'#eee':'#2a2a2a'};">${escHtml(cand.body)}</span></div><div class="cl-btns"><span class="cl-btn dec">${ICON_CLOSE}</span><span class="cl-btn acc">${ICON_VIDEO}</span></div></div></div>`;
  }
  if(cand.style==='vcall'){
    // v18 신규: "연결된 영상통화 화면" - 세로로 긴 실제 폰 모양(좁은 폭+둥근 모서리 테두리) 카드.
    // 화면 안 빈 공간엔 영상 대신 프로필 아이콘(사람 모양)을 넣어 "영상이 비어있는 통화 중" 느낌을
    // 냄. 팔레트 색 커스텀 가능(STATUS_COLORS, box/community와 동일 팔레트) - 사용자가 "색도
    // 정할 수 있게" 요청함. 아래 마이크/종료(빨강)/카메라 컨트롤 바는 v17 디자인 그대로 재사용.
    const s=STATUS_COLORS[cand.colorIdx];
    const fg=s.dark?'#eee':'#2a2a2a';
    return `<div class="vc2-card" style="${al}background:${s.bg};border-color:${s.border||'#222'};"><div class="vc2-top" style="color:${fg};">${nameTxt?`<span class="vc2-name">${escHtml(nameTxt)}</span>`:''}<span class="vc2-time">영상통화 중</span></div><div class="vc2-screen"><span class="vc2-avatar">${ICON_PERSON}</span><span class="vc2-cap" style="color:${fg};">${escHtml(cand.body)}</span></div><div class="vc2-bar"><span class="vc2-btn">${ICON_MIC}</span><span class="vc2-btn end">${ICON_CLOSE}</span><span class="vc2-btn">${ICON_VIDEO}</span></div></div>`;
  }
  if(cand.style==='live'){
    // v9: 어두운 헤더(● LIVE 배지 + 이름) 아래 흰 본문. 색상 커스텀 없음.
    return `<div class="lv-card" style="${al}"><span class="lv-head"><span class="lv-badge"><span class="lv-dot"></span>LIVE</span>${nameTxt?`<span class="lv-name">${escHtml(nameTxt)}</span>`:''}</span><span class="lv-body">${escHtml(cand.body)}</span></div>`;
  }
  if(cand.style==='radio'){
    // v17: '라이브 라디오' 신규 - live와 같은 카드 구조, 배지만 'ON AIR'(파란색)로 구분. 색 커스텀 없음.
    return `<div class="lv-card" style="${al}"><span class="lv-head"><span class="lv-badge rd"><span class="lv-dot"></span>ON AIR</span>${nameTxt?`<span class="lv-name">${escHtml(nameTxt)}</span>`:''}</span><span class="lv-body">${escHtml(cand.body)}</span></div>`;
  }
  if(cand.style==='contact'){
    // v7 추가: 연락처 알림창 - 회색 원 안에 사람 아이콘 + 이름(대괄호 본문) 만 보여주는 카드형 박스
    // (참고 스샷: "최성규." 처럼 프로필 아이콘+이름만 있는 흰 박스)
    const s=STATUS_COLORS[cand.colorIdx];
    return `<div class="msg-contact" style="${al}background:${s.bg};border-color:${s.border};"><span class="msg-contact-icon">👤</span><span class="msg-contact-name">${escHtml(cand.body)}</span></div>`;
  }
  return cand.type==='inline'?`<span>[${escHtml(cand.body)}]</span>`:`<p>${escHtml(cand.origText)}</p>`;
}

function renderPreview(cand){
  const box=document.getElementById('prev-'+cand.id);
  if(box) box.innerHTML=buildCandHtml(cand);
}

function applyAllSameStyle(){
  const style=prompt('전체 대괄호 줄에 일괄 적용할 스타일을 입력하세요: none / kakao / community / status','kakao');
  if(!style) return;
  chapters.forEach(c=>c.candidates.forEach(cd=>{cd.style=style;cd.colorIdx=0;}));
  renderChapterTabs();
  renderChapterPanel(activeChapterIdx);
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function exportEpub(){
  document.getElementById('uploadStatus').textContent='내보내는 중...';
  // 각 챕터의 후보 <p data-utsho-id="..."> 를 최종 HTML로 교체
  for(const chap of chapters){
    // 한 줄에 여러 대괄호 덩어리가 붙어있던 그룹들을, 각각 별도 블록으로 쪼개서 교체
    const groupIds=new Set(chap.candidates.filter(c=>c.groupId).map(c=>c.groupId));
    groupIds.forEach(gid=>{
      const p=chap.doc.querySelector(`[data-utsho-group="${gid}"]`);
      if(!p) return;
      const members=chap.candidates.filter(c=>c.groupId===gid).sort((a,b)=>a.groupOrder-b.groupOrder);
      const frag=chap.doc.createDocumentFragment();
      members.forEach(cand=>{
        const html=cand.style==='none'?`<p>[${escHtml(cand.body)}]</p>`:buildCandHtml(cand);
        const w=chap.doc.createElement('div');
        w.innerHTML=html;
        while(w.firstChild) frag.appendChild(w.firstChild); // v6: 자식 노드 전부 옮김(이름표+말풍선처럼 최상위 요소가 2개 이상인 경우 두번째 요소가 버려지던 버그 수정)
      });
      p.replaceWith(frag);
    });
    chap.candidates.filter(c=>!c.groupId).forEach(cand=>{
      const el=chap.doc.querySelector(`[data-utsho-id="${cand.id}"]`);
      if(!el) return;
      if(cand.type==='cleanup_bracket'){
        if(cand.style!=='done') return;
        el.textContent=el.textContent.replace(/[\[\]]/g,'');
        return;
      }
      if(cand.type==='cleanup_align'){
        if(cand.style!=='done') return;
        el.setAttribute('style',(el.getAttribute('style')||'')+';text-align:center;');
        return;
      }
      if(cand.style==='none') return; // 원본 그대로 둠(속성만 남아있어도 렌더링엔 지장 없음)
      const wrapper=chap.doc.createElement('div');
      wrapper.innerHTML=buildCandHtml(cand);
      el.replaceWith(...wrapper.childNodes); // v6: firstElementChild 하나만 쓰면 이름표(kt-name)만 남고 말풍선(실제 메시지)이 통째로 사라지던 버그 수정 - 모든 자식 노드를 그대로 넘김
    });
    const serialized=new XMLSerializer().serializeToString(chap.doc);
    zip.file(chap.path,serialized);
  }
  // 스타일 시트에 필요한 클래스 추가(이미 있으면 중복 방지)
  // v23: 합권기로 합친 여러 권짜리 이펍처럼 style.css가 b1/style.css, b2/style.css 식으로 여러 개
  // 있을 수 있는데, 예전엔 Object.keys(...).find(...)로 "맨 처음 찾은 style.css 1개"에만 CSS를
  // 넣었음 - 챕터(HTML)는 모든 권에 다 스타일이 입혀지는데 CSS는 한 권(보통 1권)에만 들어가서,
  // 나머지 권은 카드 모양 없이 밋밋하게 나오는 버그가 있었음(사용자가 실제로 2권 쪽 뉴스 카드가
  // 안 꾸며진 이펍으로 제보함). find를 filter로 바꿔서 찾은 style.css 전부에 똑같이 넣도록 고침.
  const cssPaths=Object.keys(zip.files).filter(p=>/style\.css$/i.test(p));
  for(const cssPath of cssPaths){
    let css=await zip.file(cssPath).async('string');
    if(!css.includes('/* utsho-editor-css-v9 */')){
      css+=`
