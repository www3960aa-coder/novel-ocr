<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이펍 튜너 v25</title>
<style>
:root{--p:#7a6ced;--p-dark:#5a4bcf;--p-light:#ede9ff;--bg:#f7f8fc;--panel:#fff;--text:#2c303a;--sub:#888;--border:#e4e7f0;--hover:#f0f2fa;--r:12px;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:14px;}
.mobile-header{display:none;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);align-items:center;justify-content:space-between;z-index:50;}
.mobile-title{font-weight:800;color:var(--p-dark);font-size:1rem;}
.hamburger-btn{background:var(--p);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;}
.app-container{display:flex;flex-direction:row;flex:1;overflow:hidden;width:100vw;}
.sidebar{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:1000;transition:left .28s ease;}
.sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.38);z-index:999;}
.sidebar-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);background:#fdfdff;flex-shrink:0;}
.sidebar-header h1{font-size:1.2rem;color:var(--p-dark);margin:0 0 3px;font-weight:800;text-align:center;}
.sidebar-header p{font-size:.75rem;color:var(--sub);margin:0;text-align:center;}
.sidebar-content{flex:1;overflow-y:auto;padding:14px;}
.sidebar-footer{padding:14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.preview-area{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;}
.preview-header{padding:13px 18px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.preview-title-badge{font-weight:700;color:#555;margin-right:auto;background:var(--bg);padding:5px 12px;border-radius:20px;font-size:.8rem;border:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;}
.preview-tabs{display:flex;gap:7px;}
.tab-btn{padding:7px 16px;border:1px solid var(--border);background:#fff;border-radius:20px;font-size:.85rem;cursor:pointer;color:var(--text);font-weight:600;transition:all .18s;white-space:nowrap;}
.tab-btn.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 3px 10px rgba(122,108,237,.25);}
.preview-body{flex:1;padding:18px;overflow-y:auto;display:flex;justify-content:center;}
.preview-panel{display:none;width:100%;max-width:860px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.04);border:1px solid var(--border);flex-direction:column;overflow:auto;padding:18px;align-self:flex-start;}
.preview-panel.active{display:flex;}
.pv{border:1px solid var(--border);border-radius:10px;background:#fff;color:#2f2930;padding:0 18px 4px;overflow:hidden}
.note{font-size:.78rem;color:var(--sub);margin-top:10px}
.log{font-size:.85rem;color:#555;white-space:pre-wrap;line-height:1.7}
.drop-zone{background:#fdfdff;border:2px dashed #c0b8f0;padding:18px 14px;text-align:center;border-radius:12px;cursor:pointer;transition:all .18s;margin-bottom:8px;}
.drop-zone:hover,.drop-zone.on{background:var(--hover);border-color:var(--p);}
.drop-zone-text{color:var(--p-dark);font-weight:700;font-size:.88rem;margin-top:6px;}
.file-list{font-size:.75rem;color:var(--sub);white-space:pre-wrap;margin:0 0 14px;word-break:break-all;}
details{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
summary{padding:12px 14px;font-size:.88rem;font-weight:700;cursor:pointer;user-select:none;list-style:none;display:flex;justify-content:space-between;align-items:center;background:#fbfbfc;color:var(--p-dark);}
summary::-webkit-details-marker{display:none;}
summary::after{content:'▼';font-size:.7rem;color:var(--p);transition:transform .18s;}
details[open]>summary{border-bottom:1px solid var(--border);}
details[open]>summary::after{transform:rotate(180deg);}
.details-content{padding:13px;display:flex;flex-direction:column;gap:4px;background:#fff;}
.opt-box{background:var(--bg);padding:9px 11px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:.82rem;cursor:pointer;font-weight:500;margin-bottom:6px;}
.opt-box input[type=checkbox]{width:15px;height:15px;accent-color:var(--p);cursor:pointer;}
.opt-box small{color:var(--sub);font-size:.72rem;}
.row{display:grid;grid-template-columns:1fr 68px;gap:4px 10px;align-items:center;margin:6px 0}
.row label{grid-column:1/-1;font-size:.75rem;font-weight:700;color:#555}
.row input[type=range]{width:100%;accent-color:var(--p)}
.row input[type=number]{width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;background:#fff;color:var(--text)}
.row2{margin:8px 0}
.row2>label{display:block;font-size:.75rem;font-weight:700;color:#555;margin-bottom:5px}
.row2 span{display:flex;gap:8px;align-items:center}
select{width:100%;border:1px solid var(--border);background:#fff;padding:9px 10px;border-radius:8px;font-size:.82rem;outline:none;font-family:inherit;cursor:pointer;font-weight:500;color:var(--text)}
input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--border);border-radius:8px;background:none;flex-shrink:0}
.cr select{flex:1;min-width:0}.cr input[type=color]{width:44px;height:38px;flex:none;padding:2px}.pbtn{background:none;border:0;color:var(--p-dark);font-size:.75rem;font-weight:700;padding:4px 0;cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.sw b{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:inline-block}
.sw b:hover{outline:2px solid var(--p)}
.btn-main{width:100%;padding:15px;background:var(--p);border:none;color:#fff;border-radius:14px;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--p-dark);transition:opacity .18s,transform .1s;}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--p-dark);}
.btn-main:disabled{opacity:.55;cursor:not-allowed;}
.btn-secondary{background:#fff;border:1.5px solid var(--p);color:var(--p);padding:9px;border-radius:10px;width:100%;font-weight:700;cursor:pointer;font-size:.82rem;transition:background .18s;}
.btn-secondary:hover{background:var(--hover);}
@media(max-width:800px){.mobile-header{display:flex;}.sidebar{position:fixed;left:-100%;top:0;width:320px;max-width:85vw;height:100%;}.sidebar.open{left:0;}.sidebar-overlay.open{display:block;}.preview-area{height:calc(100vh - 57px);height:calc(100dvh - 57px);}.preview-body{padding:10px;}.tab-btn{padding:7px 13px;font-size:.8rem;}}

.sidebar-header{padding:10px 14px 8px}.sidebar-content{padding:10px}.drop-zone{padding:10px 12px;margin-bottom:6px}.drop-zone-text{margin-top:2px}
summary{padding:9px 12px}.details-content{padding:8px 10px}.row2{margin:4px 0}.row2>label{margin-bottom:3px}
.sidebar-footer{flex-direction:row;padding:10px;gap:8px}.sidebar-footer button{flex:1;padding:11px 6px}
.preview-body{padding-bottom:36px;align-items:flex-start}.preview-panel{overflow:visible}
.sidebar-content{padding-top:26px}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;padding:8px 4px;border:1.5px solid var(--border);background:#fff;border-radius:8px;font-weight:700;font-size:.8rem;color:#555;cursor:pointer}.seg button.on{background:var(--p);border-color:var(--p);color:#fff}
</style></head><body>
<div class="mobile-header"><span class="mobile-title">🎚️ 이펍 튜너 v25</span><button class="hamburger-btn" id="hamburgerBtn">☰ 설정</button></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-container">
<aside class="sidebar" id="sidebar">
 <div class="sidebar-header"><h1>🎚️ 이펍 튜너 v25</h1><p>EPUB 글꼴 · 제목 모양 바꾸기</p></div>
 <div class="sidebar-content">
  <div class="drop-zone" id="drop"><div style="font-size:1.5rem;">📘</div><div class="drop-zone-text">EPUB 파일 선택 / 드래그 (여러 개 가능)</div><input type="file" id="f" accept=".epub" multiple hidden></div>
  <div class="file-list" id="files">선택된 파일 없음</div>
  <div id="ctl">
   <details open><summary>글꼴</summary><div class="details-content">
     <div class="row2"><label>전체 글꼴</label><select id="all"><option value="" hidden>따로 설정됨</option><option value="g">고운돋움</option><option value="a">산돌체</option><option value="s">고딕</option><option value="r">명조(serif)</option></select></div>
     <div class="row2"><label>화수·소제목 글꼴</label><select id="tf"><option value="g">고운돋움</option><option value="a">산돌체</option><option value="s">고딕</option><option value="r">명조(serif)</option><option value="k">원본 그대로</option></select></div>
     <div class="row2"><label>본문 글꼴</label><select id="bf"><option value="g">고운돋움</option><option value="a">산돌체</option><option value="s">고딕</option><option value="r">명조(serif)</option><option value="k">원본 그대로</option></select></div>
   </div></details>
   <details open><summary>제목 모양</summary><div class="details-content">
     <div class="row2"><label>제목 줄 구성</label><select id="tm"><option value="two">화수 / 소제목 (두 줄)</option><option value="one">화수. 소제목 (한 줄)</option></select></div>
   </div></details>
   
  </div>
 </div>
 <div class="sidebar-footer"><button class="btn-secondary" id="reset">기본값으로</button><button class="btn-main" id="go" disabled>적용해서 저장</button></div>
</aside>
<section class="preview-area">
 <div class="preview-header"><span class="preview-title-badge" id="pvBadge">미리보기</span><div class="preview-tabs"><button class="tab-btn active" data-tab="pv">미리보기</button><button class="tab-btn" data-tab="log">결과</button></div></div>
 <div class="preview-body">
  <div class="preview-panel active" id="view-pv"><div class="pv" id="pv"></div><details open style="margin-top:14px"><summary>색 · 정렬 (미리보기 보면서 바꾸세요)</summary><div class="details-content">
     <div class="row2"><button type="button" class="pbtn" data-sw="sw_all">🎨 팔레트 닫기</button>
     <div id="sw_all" style="display:block"><div class="seg" id="tgt"><button type="button" data-t="h" class="on">화수</button><button type="button" data-t="s">소제목</button><button type="button" data-t="b">둘 다</button></div><div class="sw" id="sw_pal"></div></div></div>
   <details style="margin:8px 0 0"><summary>자세히 · 색 방식 / 정렬</summary><div class="details-content"><div class="row2"><label>화수 색 · 정렬</label><span class="cr"><select id="hc"><option value="b">기본 검정</option><option value="c">직접 선택</option><option value="k">원본 그대로</option></select><input type="color" id="hcc" value="#a8645a" style="display:none"><select id="ha"><option value="k">정렬 원본</option><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></span></div>
     <div class="row2"><label>소제목 색 · 정렬</label><span class="cr"><select id="sc"><option value="b">기본 검정</option><option value="c">직접 선택</option><option value="k">원본 그대로</option></select><input type="color" id="scc" value="#a8645a" style="display:none"><select id="sa"><option value="k">정렬 원본</option><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></span></div>
   </div></details>
   </div></details><div class="note">실제 리더에서는 폰트가 조금 다르게 보일 수 있어요. 크기 비율을 보는 용도예요.</div></div>
  <div class="preview-panel" id="view-log"><div class="log" id="log">아직 적용한 파일이 없어요.</div></div>
 </div>
</section>
</div>

function splitTitles(h){let c=0;const out=h.replace(/<h([12])([^>]*)>\s*(?:<span class="grad-tt">([^<]*)<\/span>|([^<]*))\s*<\/h\1>(\s*)(?!<p)/g,(m,hl,at,a,b,ws)=>{const txt=(a!==undefined?a:b||'').replace(/&nbsp;|\u00a0/g,' ').trim();const mm=RX.exec(txt);if(!mm||/^[#＃]?\d+$/.test(mm[2].trim())||/^[#＃]/.test(mm[2].trim()))return m;c++;return '<h'+hl+at+'><span class="grad-tt">'+mm[1].replace(/\s+$/,'')+'</span></h'+hl+'><p style="text-align:center;text-indent:0;font-weight:700;">'+mm[2].trim()+'</p>'+ws});return [out,c]}
