<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>EPUB 삽화·다중표지 처리 테스트 툴</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --primary: #4f46e5;
    --primary-light: #e0e7ff;
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --border-color: #e2e8f0;
    --success: #10b981;
  }
  
  body {
    margin: 0; 
    padding: 20px;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
  }

  h1 {
    font-size: 22px;
    color: var(--primary);
    text-align: center;
    margin-bottom: 24px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  .dropzone {
    border: 2px dashed #a5b4fc;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--primary);
    font-weight: bold;
    cursor: pointer;
    background: #fefeff;
    transition: all 0.2s;
  }

  .dropzone:hover, .dropzone.drag {
    background: var(--primary-light);
    border-color: var(--primary);
  }

  input[type=file] { display: none; }

  .btn-primary {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
  }

  .btn-primary:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }

  .preview-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
  }

  .preview-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: #f8fafc;
  }

  .preview-thumb {
    width: 60px;
    height: 80px;
    object-fit: contain;
    background: #e2e8f0;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #64748b;
  }

  .preview-info {
    flex: 1;
  }

  .preview-title {
    font-weight: bold;
    font-size: 14px;
    word-break: break-all;
  }

  .preview-type {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: bold;
    display: inline-block;
    margin-top: 4px;
  }

  .type-cover { background: #fee2e2; color: #b91c1c; }
  .type-illust { background: #dcfce7; color: #15803d; }
  .type-text { background: #f1f5f9; color: #475569; }
  .type-text-img { background: #e0e7ff; color: #4338ca; }

  #logArea {
    margin-top: 20px;
    padding: 12px;
    background: #1e293b;
    color: #38bdf8;
    border-radius: 8px;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }

  #downloadArea {
    margin-top: 20px;
    text-align: center;
  }

  .dl-btn {
    display: inline-block;
    padding: 16px 32px;
    background: var(--success);
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
  }
</style>
</head>
<body>

  <h1>(ง •̀_•́)ง✧ EPUB 삽화·표지 보존 테스트</h1>
  
  <div class="card">
    <div class="dropzone" id="dropzone">
      📂 테스트할 원본 EPUB 파일을 여기에 선택하거나 끌어다 놓으세요.
    </div>
    <input type="file" id="fileInput" accept=".epub" />
  </div>

  <div class="card" id="previewCard" style="display: none;">
    <h3 style="margin-top: 0;">🔍 척추(Spine) 분석 및 미리보기</h3>
    <div style="font-size: 13px; color: var(--text-sub);">
      XHTML 내부 구조를 분석하여 텍스트와 이미지 페이지를 구별합니다.<br/>
      이미지 전용 페이지는 빈 페이지 오류 방지를 위해 표준 XHTML 구조로 안전하게 재작성됩니다.
    </div>
    <div class="preview-list" id="previewList"></div>
    <button class="btn-primary" id="processBtn">새 EPUB 구조로 저장 및 테스트</button>
  </div>

  <div id="logArea"></div>
  <div id="downloadArea"></div>

<script>
(function() {
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const previewCard = document.getElementById('previewCard');
  const previewList = document.getElementById('previewList');
  const processBtn = document.getElementById('processBtn');
  const logArea = document.getElementById('logArea');
  const downloadArea = document.getElementById('downloadArea');

  let currentZip = null;
  let originalFilename = '';
  let spineDataList = [];
  let opfPath = '';
  let opfDir = '';
  let opfDoc = null;

  // 파일 업로드 이벤트
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault(); dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  function log(msg) {
    logArea.style.display = 'block';
    logArea.textContent += msg + '\n';
    logArea.scrollTop = logArea.scrollHeight;
  }

  // 절대경로 해석 함수 (상대경로 해결)
  function resolvePath(basePath, relativePath) {
    const stack = basePath.split('/');
    stack.pop(); // 파일명 제거
    const parts = relativePath.split('/');
    for (const p of parts) {
      if (p === '.') continue;
      if (p === '..') stack.pop();
      else stack.push(p);
    }
    return stack.join('/');
  }

  // 표준 이미지 페이지 템플릿 생성 (리디/마루/파일룸 100% 호환용)
  function buildSafeXhtml(imgSrc) {
    return `<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8"/>
<title>Image</title>
<style type="text/css">
  html, body { margin: 0; padding: 0; text-align: center; }
  div.img-wrap { margin: 0; padding: 0; text-align: center; }
  img { max-width: 100%; height: auto; margin: 0 auto; display: inline-block; }
</style>
</head>
<body>
  <div class="img-wrap">
    <img src="${imgSrc}" alt="image" />
  </div>
</body>
</html>`;
  }

  // 파일 분석 시작
  async function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.epub')) {
      alert('EPUB 파일만 업로드 가능합니다.');
      return;
    }
    
    originalFilename = file.name;
    previewList.innerHTML = '';
    spineDataList = [];
    logArea.textContent = '';
    logArea.style.display = 'none';
    downloadArea.innerHTML = '';
    previewCard.style.display = 'none';
    
    dropzone.textContent = `⏳ ${file.name} 분석 중...`;

    try {
      currentZip = await JSZip.loadAsync(file);
      
      // 1. container.xml 파싱
      const containerXml = await currentZip.file('META-INF/container.xml').async('string');
      const opfMatch = containerXml.match(/full-path="([^"]+)"/);
      if (!opfMatch) throw new Error('OPF 경로를 찾을 수 없습니다.');
      
      opfPath = opfMatch[1];
      opfDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
      
      const opfText = await currentZip.file(opfPath).async('string');
      const parser = new DOMParser();
      opfDoc = parser.parseFromString(opfText, 'text/xml');
      
      // 2. Manifest 매핑
      const manifest = {};
      opfDoc.querySelectorAll('manifest > item').forEach(item => {
        manifest[item.getAttribute('id')] = item.getAttribute('href');
      });

      // 3. Spine 순회하며 페이지 분석
      const spineItems = opfDoc.querySelectorAll('spine > itemref');
      let coverCount = 1;
      let illustCount = 1;
      let textHit = false; // 본문이 시작되었는지 확인

      for (const itemref of spineItems) {
        const idref = itemref.getAttribute('idref');
        const href = manifest[idref];
        if (!href) continue;

        const fullPath = opfDir + href;
        const zFile = currentZip.file(fullPath) || currentZip.file(decodeURIComponent(fullPath));
        if (!zFile) continue;

        const content = await zFile.async('string');
        
        // 이미지 경로 추출 (img 태그 또는 svg image 태그)
        let imgSrc = null;
        let absoluteImgPath = null;
        const imgMatch = content.match(/(?:src|xlink:href)\s*=\s*["']([^"']+\.(?:jpe?g|png|webp|gif))["']/i);
        
        if (imgMatch) {
          imgSrc = imgMatch[1];
          absoluteImgPath = resolvePath(fullPath, imgSrc);
        }

        // 페이지 유형 판별 (태그 제거 후 텍스트 길이 측정)
        const bodyMatch = content.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        const searchArea = bodyMatch ? bodyMatch[1] : content;
        const cleanText = searchArea.replace(/<[^>]+>/g, '').replace(/\s+/g, '').trim();
        
        let type = 'text';
        let isImageOnly = false;

        if (imgSrc) {
          if (cleanText.length < 50) {
            isImageOnly = true;
            if (!textHit) {
              type = 'cover';
            } else {
              type = 'illust';
            }
          } else {
            type = 'text-img';
            textHit = true;
          }
        } else if (cleanText.length > 0) {
          textHit = true;
        }

        // 썸네일 생성을 위한 Base64 추출
        let thumbBase64 = '';
        if (absoluteImgPath) {
          const imgFile = currentZip.file(absoluteImgPath) || currentZip.file(decodeURIComponent(absoluteImgPath));
          if (imgFile) {
            const ext = absoluteImgPath.split('.').pop().toLowerCase();
            const mime = ext === 'png' ? 'image/png' : ext === 'webp' ? 'image/webp' : ext === 'gif' ? 'image/gif' : 'image/jpeg';
            const base64 = await imgFile.async('base64');
            thumbBase64 = `data:${mime};base64,${base64}`;
          }
        }

        const spineObj = {
          id: idref,
          href: href,
          fullPath: fullPath,
          originalContent: content,
          imgSrc: imgSrc, // 원본 HTML에 적힌 상대 경로
          isImageOnly: isImageOnly,
          type: type,
          thumb: thumbBase64
        };
        
        spineDataList.push(spineObj);
        
        // UI 렌더링
        let typeLabel = '';
        let typeClass = '';
        
        if (type === 'cover') { typeLabel = `표지 ${coverCount++}`; typeClass = 'type-cover'; }
        else if (type === 'illust') { typeLabel = `본문 삽화 ${illustCount++}`; typeClass = 'type-illust'; }
        else if (type === 'text-img') { typeLabel = '본문 + 삽화 (유지)'; typeClass = 'type-text-img'; }
        else { typeLabel = '텍스트 페이지'; typeClass = 'type-text'; }

        const imgTag = thumbBase64 ? `<img src="${thumbBase64}" class="preview-thumb"/>` : `<div class="preview-thumb">TXT</div>`;

        previewList.innerHTML += `
          <div class="preview-item">
            ${imgTag}
            <div class="preview-info">
              <div class="preview-title">${href.split('/').pop()}</div>
              <div class="preview-type ${typeClass}">${typeLabel}</div>
              ${spineObj.isImageOnly ? `<div style="font-size:11px;color:#64748b;margin-top:4px;">⚠️ 안전한 이미지 페이지로 재작성됨</div>` : ''}
            </div>
          </div>
        `;
      }
      
      dropzone.textContent = `📂 ${file.name} (분석 완료)`;
      previewCard.style.display = 'block';

    } catch (e) {
      dropzone.textContent = `❌ 분석 실패: ${e.message}`;
      alert(e.message);
    }
  }

  // 처리 및 저장
  processBtn.addEventListener('click', async () => {
    processBtn.disabled = true;
    processBtn.textContent = '📦 새 EPUB 생성 중...';
    log('▶ 이미지 페이지 최적화 및 EPUB 재구성 시작...');

    try {
      const outZip = new JSZip();
      
      // mimetype은 비압축이어야 함
      outZip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
      
      // 기존 파일 그대로 복사하되, XHTML만 분석 결과에 따라 교체
      const entries = Object.keys(currentZip.files);
      
      for (const entryPath of entries) {
        if (entryPath === 'mimetype') continue;
        if (currentZip.files[entryPath].dir) continue;

        // 현재 파일이 분석된 Spine XHTML 중 하나인지 확인
        const spineMatch = spineDataList.find(s => s.fullPath === entryPath || decodeURIComponent(s.fullPath) === entryPath);
        
        if (spineMatch && spineMatch.isImageOnly && spineMatch.imgSrc) {
          // 이미지 전용 페이지라면 표준 XHTML 구조로 재작성
          const safeHtml = buildSafeXhtml(spineMatch.imgSrc);
          outZip.file(entryPath, safeHtml);
          log(`  └ 변경됨 (빈 페이지 방지): ${entryPath}`);
        } else {
          // 그 외의 파일(본문, CSS, 이미지, OPF 등)은 원본 데이터 100% 보존
          const data = await currentZip.file(entryPath).async('uint8array');
          outZip.file(entryPath, data);
        }
      }

      log('▶ 기존 파일 복사 및 경로 보존 완료');
      log('▶ ZIP 압축 중...');

      const blob = await outZip.generateAsync({
        type: 'blob', 
        mimeType: 'application/epub+zip',
        compression: 'DEFLATE', 
        compressionOptions: { level: 6 }
      });

      const outName = originalFilename.replace(/\.epub$/i, '_이미지보존테스트.epub');
      const url = URL.createObjectURL(blob);
      
      downloadArea.innerHTML = `<a href="${url}" download="${outName}" class="dl-btn">⬇️ ${outName} 다운로드</a>`;
      log(`✅ 완료! 하단의 다운로드 버튼을 눌러 테스트해보세요.`);

    } catch (e) {
      log(`❌ 생성 중 오류 발생: ${e.message}`);
    } finally {
      processBtn.disabled = false;
      processBtn.textContent = '새 EPUB 구조로 저장 및 테스트';
    }
  });

})();
</script>
</body>
</html>
